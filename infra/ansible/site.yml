---
- hosts: vpn_nodes
  become: yes
  roles:
    - bootstrap_node
    # Protocol roles: always included so they can clean up removed
    # protocols.  Each role handles its own gating internally and
    # stops+disables its services when the config vars are absent.
    # ShadowTLS deprecated (0.2) — мёртв, no new configs.
    # Hysteria2 РЕАНИМИРОВАН 2026-07-22: UDP/QUIC переживает ТСПУ в жёстких
    # регионах (Центральный ФО режет TCP-Reality), где VLESS не работает.
    # См. docs/operations/regional_blocking_diag_2026_07.md. Роль сама no-op'ит
    # на нодах без hysteria2_port, так что безопасна для всего флота.
    # - install_shadowtls_stack
    - install_hysteria2
    - install_vless_reality
    - install_vless_xhttp
    # ws_cdn ПОСЛЕ xhttp: оба делят nginx :443, и ws_cdn гоняет `nginx -t`
    # по всему дереву — пусть xhttp сначала выпустит/устаканит свой серт+vhost,
    # иначе транзиентно-битый xhttp-vhost уронит nginx -t у ws_cdn.
    - install_vless_ws_cdn
    # Relay: WG tunnel to foreign exit node. Patches Xray outbound with
    # sockopt.interface: wg0 so user traffic exits via the tunnel while
    # management traffic stays on the main interface. Role runs
    # unconditionally — with relay_wg_* set it enables the tunnel, and
    # without them it's an idempotent cleanup (no-op on direct nodes).
    # See RELAY_ROADMAP.md stage D.1.
    - role: relay_jump_node
    # Traffic collector (opt-in).
    - role: install_traffic_collector
      when: traffic_collector_backend_url | default('') | length > 0
    # Node-to-node probe agent (opt-in). Nodes probe each other and
    # report back to the backend — catches RU-internal blocking that
    # external probers miss.
    - role: install_probe_agent
      when: probe_agent_backend_url | default('') | length > 0
    # Sharing enforcer — local daemon that detects credential sharing
    # via xray access logs and disrupts it via gRPC rmuser/adduser.
    # Tagged so operators can stop/disable it without touching the
    # protocol roles (которые при накате перезапускают xray).
    - role: install_sharing_enforcer
      tags: [sharing_enforcer]
    - check_node_health
  post_tasks:
    # Маркер «какой версией кода прошита нода». Пишется post_tasks, ПОСЛЕ всех
    # ролей: если play упал посередине, маркер остаётся старым и честно
    # показывает, что нода не догналась. Версия приезжает в extra_vars от
    # бэкенда (_collect_site_extra_vars → vpn_release_version); при ручном
    # прогоне ansible её нет — тогда маркер не трогаем, чтобы не затереть
    # реальную версию строкой-заглушкой.
    - name: Stamp node release marker
      ansible.builtin.copy:
        dest: /etc/vpn-node-release.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "version": "{{ vpn_release_version }}",
            "applied_at": "{{ ansible_date_time.iso8601 }}"
          }
      when: vpn_release_version | default('') | length > 0
      tags: [release_marker]

# ── WireGuard exit nodes (foreign, non-RU) ──────────────────────────
- hosts: wg_exit_nodes
  become: yes
  tags: [relay, wg-exit]
  roles:
    - role: wg_exit_node
      when: wg_exit_private_key is defined and wg_exit_private_key | length > 0

- hosts: db_host
  become: yes
  roles:
    - db_host

- hosts: vpn_nodes:wg_exit_nodes
  become: yes
  tags: [monitoring]
  roles:
    - node_exporter

- hosts: monitoring
  become: yes
  tags: [monitoring]
  roles:
    - monitoring_stack

- hosts: web
  become: yes
  tags: [web, app]
  roles:
    - deploy_app_stack

- hosts: web
  become: yes
  tags: [web, frontend]
  roles:
    - deploy_web_frontend

# Mgmt-mirror — статичный nginx с upstream-ресурсами (geoip.dat,
# Xray-linux-64-*.zip) для vpn-нод. Живёт на том же физическом сервере
# что web/app, но в отдельном compose-стеке (отдельная роль с отдельным
# жизненным циклом). При `site.yml --tags web` прокатается вместе с
# остальной web-инфой. Точечный refresh — `--tags mirror`. См.
# roles/mgmt_mirror и playbooks/mgmt_mirror.yml.
- hosts: web
  become: yes
  tags: [web, mirror]
  roles:
    - mgmt_mirror

# ── Бэкапы БД ────────────────────────────────────────────────────────
# web-хост снимает дамп по таймеру, шифрует и раскладывает копии по
# exit-нодам; exit'ы принимают их forced-command ключом (ни шелла, ни
# форвардинга). Тег `backup` катает обе половины; `--tags web` обновляет
# только web-часть (таймер/скрипт/конфиг). Backend site.yml на exit'ы не
# гоняет (у него playbooks/bootstrap_exit.yml), так что play ниже — только
# для ручных прогонов из статик-инвентаря.
- hosts: web
  become: true
  tags: [web, backup]
  roles:
    - db_backup

- hosts: wg_exit_nodes
  become: true
  tags: [backup]
  roles:
    - db_backup_receiver
