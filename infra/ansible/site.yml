---
- hosts: vpn_nodes
  become: yes
  roles:
    - bootstrap_node
    - install_shadowtls_stack
    # VLESS Reality — needs backend-generated x25519 keys + shortId.
    - role: install_vless_reality
      when: vless_reality_private_key is defined and vless_reality_private_key | length > 0
    # VLESS+WS+CDN — WebSocket transport through Cloudflare.
    - role: install_vless_ws_cdn
      when: vless_ws_cdn_domain is defined and vless_ws_cdn_domain | length > 0
    # Hysteria2 — UDP/QUIC fallback protocol.
    - role: install_hysteria2
      when: hysteria2_port is defined
    # Traffic collector (opt-in).
    - role: install_traffic_collector
      when: traffic_collector_backend_url | default('') | length > 0
    - check_node_health

- hosts: db_host
  become: yes
  roles:
    - db_host

- hosts: vpn_nodes
  become: yes
  tags: [monitoring]
  roles:
    - node_exporter

- hosts: monitoring
  become: yes
  tags: [monitoring]
  roles:
    - monitoring_stack

- hosts: web
  become: yes
  tags: [web, app]
  roles:
    - deploy_app_stack

- hosts: web
  become: yes
  tags: [web, frontend]
  roles:
    - deploy_web_frontend
