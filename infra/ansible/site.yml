---
- hosts: vpn_nodes
  become: yes
  roles:
    - bootstrap_node
    # Protocol roles: always included so they can clean up removed
    # protocols.  Each role handles its own gating internally and
    # stops+disables its services when the config vars are absent.
    # ShadowTLS deprecated (0.2) / Hysteria2 deprecated (0.3): protocols
    # are dead, no new configs are provisioned.  Left commented out for
    # a release cycle before full deletion — uncomment if a legacy node
    # needs cleanup.
    # - install_shadowtls_stack
    # - install_hysteria2
    - install_vless_reality
    - install_vless_ws_cdn
    - install_vless_xhttp
    # Relay: WG tunnel to foreign exit node. Patches Xray outbound with
    # sockopt.interface: wg0 so user traffic exits via the tunnel while
    # management traffic stays on the main interface. Role runs
    # unconditionally — with relay_wg_* set it enables the tunnel, and
    # without them it's an idempotent cleanup (no-op on direct nodes).
    # See RELAY_ROADMAP.md stage D.1.
    - role: relay_jump_node
    # Traffic collector (opt-in).
    - role: install_traffic_collector
      when: traffic_collector_backend_url | default('') | length > 0
    # Node-to-node probe agent (opt-in). Nodes probe each other and
    # report back to the backend — catches RU-internal blocking that
    # external probers miss.
    - role: install_probe_agent
      when: probe_agent_backend_url | default('') | length > 0
    # Sharing enforcer — local daemon that detects credential sharing
    # via xray access logs and disrupts it via gRPC rmuser/adduser.
    # Tagged so operators can stop/disable it without touching the
    # protocol roles (которые при накате перезапускают xray).
    - role: install_sharing_enforcer
      tags: [sharing_enforcer]
    - check_node_health

# ── WireGuard exit nodes (foreign, non-RU) ──────────────────────────
- hosts: wg_exit_nodes
  become: yes
  tags: [relay, wg-exit]
  roles:
    - role: wg_exit_node
      when: wg_exit_private_key is defined and wg_exit_private_key | length > 0

- hosts: db_host
  become: yes
  roles:
    - db_host

- hosts: vpn_nodes:wg_exit_nodes
  become: yes
  tags: [monitoring]
  roles:
    - node_exporter

- hosts: monitoring
  become: yes
  tags: [monitoring]
  roles:
    - monitoring_stack

- hosts: web
  become: yes
  tags: [web, app]
  roles:
    - deploy_app_stack

- hosts: web
  become: yes
  tags: [web, frontend]
  roles:
    - deploy_web_frontend
