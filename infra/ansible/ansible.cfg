[defaults]
# Roles live in ./roles regardless of whether the playbook is at the
# repo root (site.yml) or in a subdir (playbooks/*.yml). Without an
# explicit roles_path, ansible only looks next to the playbook and the
# subdir case breaks.
roles_path = roles:playbooks/../roles
inventory = inventories/prod/hosts.yml
host_key_checking = False
stdout_callback = default
