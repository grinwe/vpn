[defaults]
# Roles live in ./roles regardless of whether the playbook is at the
# repo root (site.yml) or in a subdir (playbooks/*.yml). Without an
# explicit roles_path, ansible only looks next to the playbook and the
# subdir case breaks.
roles_path = roles:playbooks/../roles
inventory = inventories/prod/hosts.yml
host_key_checking = False
stdout_callback = default
# Cache facts so repeated runs against the same host don't re-gather.
forks = 20

[ssh_connection]
# Multiplex one TCP connection per host across all tasks. Without this
# every task opens a fresh ssh, which means a passphrase-protected key
# prompts on every single task. ControlPersist=10m keeps the master
# socket alive between plays so even a multi-playbook run paswords once.
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ControlPath=~/.ansible/cp/%h-%p-%r
pipelining = True
