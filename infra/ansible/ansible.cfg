[defaults]
# Roles live in ./roles regardless of whether the playbook is at the
# repo root (site.yml) or in a subdir (playbooks/*.yml). Without an
# explicit roles_path, ansible only looks next to the playbook and the
# subdir case breaks.
roles_path = roles:playbooks/../roles
inventory = inventories/prod/hosts.yml
host_key_checking = False
stdout_callback = default
# Cache facts so repeated runs against the same host don't re-gather.
# Без caching gather_facts на каждом ansible-playbook прогоне даёт
# +5-10s/host (resync на 5 нод = +25-50s к голому play). Файловый
# backend — простой, не требует redis/memcached на mgmt'е. Папка должна
# быть persistent — иначе кеш умирает с каждым рестартом worker'а.
# Worker docker-compose монтирует /var/tmp/ansible_facts → volume.
fact_caching = jsonfile
fact_caching_connection = /var/tmp/ansible_facts
fact_caching_timeout = 7200
forks = 20

# Дефолтный SSH-таймаут — 10s. Для RU-нод через flaky-канал маловато,
# при forks=20 они стартуют одновременно и кто не успел до 10s ловит
# unreachable. 30s — достаточно для медленного TCP-handshake + auth.
timeout = 30

[ssh_connection]
# Multiplex one TCP connection per host across all tasks. Without this
# every task opens a fresh ssh, which means a passphrase-protected key
# prompts on every single task. ControlPersist=10m keeps the master
# socket alive between plays so even a multi-playbook run paswords once.
# ConnectTimeout/ConnectionAttempts — ssh-client level: каждый одиночный
# вызов ssh попытается приконнектиться до 3 раз с таймаутом 30s.
# Это работает на уровне OpenSSH, ниже чем ansible-овский retries —
# нас интересует именно стадия установления TCP+TLS-handshake.
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ControlPath=~/.ansible/cp/%h-%p-%r -o ConnectTimeout=30 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
pipelining = True
# Ретраи самого ansible-connection plugin поверх ssh_args. Если ssh
# отвалился (несмотря на ConnectionAttempts=3), ansible повторит
# подключение к хосту ещё столько раз. Совокупно =
# `retries × ConnectionAttempts` попыток на хост.
retries = 3
