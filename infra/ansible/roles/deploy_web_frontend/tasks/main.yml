---
- name: Assert letsencrypt email is configured
  assert:
    that:
      - deploy_web_frontend_letsencrypt_email | length > 0
    fail_msg: >
      deploy_web_frontend_letsencrypt_email must be set (set it in
      group_vars or inventory for the web host).

- name: Assert Cloudflare API token is configured (DNS challenge)
  assert:
    that:
      - deploy_web_frontend_cloudflare_api_token | length > 0
    fail_msg: >
      deploy_web_frontend_cloudflare_api_token must be set when
      deploy_web_frontend_use_dns_challenge=true. Put the token in the
      vault as vault_cloudflare_api_token (see vault.yml.example).
  when:
    - deploy_web_frontend_request_cert | bool
    - deploy_web_frontend_use_dns_challenge | bool
  no_log: true

- name: Install nginx and certbot
  apt:
    name:
      - nginx
      - certbot
      - "{{ 'python3-certbot-dns-cloudflare' if deploy_web_frontend_use_dns_challenge else 'python3-certbot-nginx' }}"
    state: present
    update_cache: true

- name: Ensure UFW allows HTTP and HTTPS
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# ── Cloudflare real-IP snippet ──────────────────────────────────────
#
# CF terminates the user's TCP connection on its edge and opens a new
# one to our origin, so $remote_addr is always a CF IP. Without this
# snippet, every log line and every rate-limit bucket would be keyed
# by CF edge IP — useless for abuse tracking. The snippet lists the
# published CF CIDR ranges as trusted proxies and tells nginx to pull
# the real client IP from the ``CF-Connecting-IP`` header.
#
# We fetch the CIDR lists at deploy time (they change rarely; CF
# publishes them as plain text). If you want auto-refresh, add a
# systemd timer that re-runs these two get_url tasks periodically.
# Shell out to system `curl` instead of ansible's `uri` here. `uri`
# runs in the controller's Python interpreter and imports `ssl`; if the
# controller has a broken Python build (e.g. self-compiled 3.10 linked
# against a missing libssl.so.1.1), ansible swallows the ImportError
# and then explodes with `NameError: name 'ssl' is not defined` when it
# actually tries to open the TLS connection. `curl` uses the system
# TLS stack, so it is resilient to whatever state the controller's
# Python venv is in — this is an infra role and we'd rather not tie
# deployment to a specific operator workstation.
- name: Fetch Cloudflare IPv4 CIDRs (on controller)
  command: curl -fsSL https://www.cloudflare.com/ips-v4
  register: cf_ipv4
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  when: deploy_web_frontend_trust_cloudflare | bool

- name: Fetch Cloudflare IPv6 CIDRs (on controller)
  command: curl -fsSL https://www.cloudflare.com/ips-v6
  register: cf_ipv6
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  when: deploy_web_frontend_trust_cloudflare | bool

- name: Render Cloudflare real-IP snippet
  template:
    src: cloudflare-real-ip.conf.j2
    dest: /etc/nginx/conf.d/cloudflare-real-ip.conf
    mode: "0644"
  when: deploy_web_frontend_trust_cloudflare | bool
  notify: reload nginx

# ── Cloudflare credentials for DNS-01 ───────────────────────────────
- name: Ensure /etc/letsencrypt exists
  file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - deploy_web_frontend_request_cert | bool
    - deploy_web_frontend_use_dns_challenge | bool

- name: Render Cloudflare credentials file
  template:
    src: cloudflare.ini.j2
    dest: "{{ deploy_web_frontend_cloudflare_credentials_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - deploy_web_frontend_request_cert | bool
    - deploy_web_frontend_use_dns_challenge | bool
  no_log: true

# ── Obtain certificate BEFORE rendering the TLS vhost ───────────────
#
# Order matters: nginx cannot start with a vhost that references a
# non-existent cert. So on first bootstrap we install nginx (still
# serving the distro default page on :80), run certbot certonly via
# DNS-01 — which doesn't need nginx to be configured for our domain at
# all — then render the real vhost and reload.
- name: Ensure nginx is running (pre-cert)
  service:
    name: nginx
    state: started
    enabled: true

- name: Check for existing Let's Encrypt certificate
  stat:
    path: "/etc/letsencrypt/live/{{ deploy_web_frontend_domain }}/fullchain.pem"
  register: le_cert

- name: Request Let's Encrypt certificate via DNS-01 (Cloudflare)
  command: >
    certbot certonly
    --dns-cloudflare
    --dns-cloudflare-credentials {{ deploy_web_frontend_cloudflare_credentials_path }}
    --dns-cloudflare-propagation-seconds {{ deploy_web_frontend_dns_propagation_seconds }}
    --non-interactive
    --agree-tos
    --email {{ deploy_web_frontend_letsencrypt_email }}
    -d {{ deploy_web_frontend_domain }}
  when:
    - deploy_web_frontend_request_cert | bool
    - deploy_web_frontend_use_dns_challenge | bool
    - not le_cert.stat.exists
  register: certbot_result
  changed_when: certbot_result.rc == 0

- name: Request Let's Encrypt certificate via nginx plugin (fallback)
  command: >
    certbot --nginx -n --agree-tos
    --email {{ deploy_web_frontend_letsencrypt_email }}
    -d {{ deploy_web_frontend_domain }}
    --redirect
  when:
    - deploy_web_frontend_request_cert | bool
    - not deploy_web_frontend_use_dns_challenge | bool
    - not le_cert.stat.exists
  notify: reload nginx

- name: Enable certbot renewal timer
  service:
    name: certbot.timer
    state: started
    enabled: true
  when: deploy_web_frontend_request_cert | bool

# ── Camo landing (anti-probing) ─────────────────────────────────────
#
# Вместо катч-олл 404 на /, nginx выше теперь отдаёт статический
# "internal tools portal". Контент должен лежать ДО рендера vhost'а —
# иначе первый reload увидит пустой root и отдаст 404 до следующего
# copy'я.
- name: Ensure camo root directory exists
  file:
    path: "{{ deploy_web_frontend_camo_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy camo landing HTML
  copy:
    src: camo-index.html
    dest: "{{ deploy_web_frontend_camo_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

# Публичные документы сервиса (оферта / возвраты / ПД) — статические страницы
# под camo-root/legal/: location / уже отдаёт файлы по $uri, отдельного
# location не нужно. Источник — docs/legal/*.md, HTML рендерит
# scripts/render_legal.py (коммитится). Их запросила СБ lava.top (22.09.2026);
# ссылки ведут из кнопки «О сервисе» в боте (LEGAL_BASE_URL).
- name: Deploy legal pages (offer, refund, privacy)
  copy:
    src: legal/
    dest: "{{ deploy_web_frontend_camo_root }}/legal/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

# ── Render and enable the real vhost (TLS-aware) ────────────────────
- name: Render nginx vhost
  template:
    src: nginx-site.conf.j2
    dest: "/etc/nginx/sites-available/{{ deploy_web_frontend_site_name }}.conf"
    mode: "0644"
  notify: reload nginx

- name: Enable nginx vhost
  file:
    src: "/etc/nginx/sites-available/{{ deploy_web_frontend_site_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ deploy_web_frontend_site_name }}.conf"
    state: link
  notify: reload nginx

# ── Зеркало саб-линка без Cloudflare (опционально) ──────────────────
#
# Тот же порядок, что и у основного домена: сначала серт, потом vhost —
# nginx не стартует с конфигом, ссылающимся на несуществующий cert.
# Всё гейтится непустым deploy_web_frontend_sub_mirror_domain.
- name: Check for existing sub-mirror certificate
  stat:
    path: "/etc/letsencrypt/live/{{ deploy_web_frontend_sub_mirror_domain }}/fullchain.pem"
  register: sub_mirror_cert
  when: deploy_web_frontend_sub_mirror_domain | length > 0

- name: Request Let's Encrypt certificate for sub-mirror (DNS-01)
  command: >
    certbot certonly
    --dns-cloudflare
    --dns-cloudflare-credentials {{ deploy_web_frontend_cloudflare_credentials_path }}
    --dns-cloudflare-propagation-seconds {{ deploy_web_frontend_dns_propagation_seconds }}
    --non-interactive
    --agree-tos
    --email {{ deploy_web_frontend_letsencrypt_email }}
    -d {{ deploy_web_frontend_sub_mirror_domain }}
  when:
    - deploy_web_frontend_sub_mirror_domain | length > 0
    - deploy_web_frontend_request_cert | bool
    - deploy_web_frontend_use_dns_challenge | bool
    - not sub_mirror_cert.stat.exists
  register: sub_mirror_certbot
  changed_when: sub_mirror_certbot.rc == 0

- name: Render sub-mirror nginx vhost
  template:
    src: nginx-sub-mirror.conf.j2
    dest: "/etc/nginx/sites-available/{{ deploy_web_frontend_sub_mirror_site_name }}.conf"
    mode: "0644"
  when: deploy_web_frontend_sub_mirror_domain | length > 0
  notify: reload nginx

- name: Enable sub-mirror nginx vhost
  file:
    src: "/etc/nginx/sites-available/{{ deploy_web_frontend_sub_mirror_site_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ deploy_web_frontend_sub_mirror_site_name }}.conf"
    state: link
  when: deploy_web_frontend_sub_mirror_domain | length > 0
  notify: reload nginx
