---
- name: Wait for expected ports
  wait_for:
    port: "{{ item }}"
    timeout: 10
  loop: "{{ vpn_health_ports | default([443,8443,9443]) }}"

- name: Check running services
  # set -o pipefail so ``ss`` failing doesn't get silently masked by
  # ``grep`` succeeding on empty input. Still ``|| true`` because an
  # empty match is a legitimate "no relevant service" outcome.
  shell: "set -o pipefail; ss -tulpn | grep -E 'xray|shadowsocks' || true"
  args:
    executable: /bin/bash
  register: service_status
  changed_when: false

- name: Show service status
  debug:
    var: service_status.stdout_lines
