# mgmt-mirror — статичный nginx, раздаёт upstream-ресурсы (geoip.dat,
# Xray-linux-64-*.zip и пр.) нашим vpn_nodes. Управляется ansible-ролью
# mgmt_mirror (см. roles/mgmt_mirror/tasks/main.yml) — отдельный compose
# stack, не объединён с основным /opt/vpn/docker-compose.yml.
#
# Раскатка:
#   cd infra/ansible
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/mgmt_mirror.yml

services:
  mgmt-mirror:
    image: nginx:alpine
    container_name: mgmt-mirror
    restart: unless-stopped
    ports:
      # Explicit 0.0.0.0 — у нас на web-host'е docker daemon биндит
      # порты compose-стэка по умолчанию на 127.0.0.1 (admin/backend
      # за loopback'ом, наружу торчит только системный nginx :443).
      # Mirror'у нужен наоборот PUBLIC bind: к нему ходят vpn-ноды
      # извне. Без 0.0.0.0 ноды получили бы Connection refused.
      #
      # 8090 а не 8080 — на 127.0.0.1:8080 уже сидит admin SPA
      # (docs/DEPLOY.md § 4). 8090 свободен (см. ss -tlnp на mgmt'е).
      - "0.0.0.0:8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets:/srv/assets:ro
    healthcheck:
      # `wget --spider` в busybox версии nginx:alpine ведёт себя
      # некорректно (отдаёт rc=1 даже на 200) — контейнер залипал
      # unhealthy. `wget -O -` пишет тело в stdout и в нормальном
      # busybox чисто mapит HTTP-200 → exit 0.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
