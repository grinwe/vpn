server {
    listen 80 default_server;
    server_name _;
    root /srv/assets;

    server_tokens off;
    access_log /var/log/nginx/mirror.access.log;
    error_log  /var/log/nginx/mirror.error.log warn;

    # autoindex для удобного ручного чека через браузер из админки.
    autoindex on;
    autoindex_format html;

    # GET/HEAD only — это read-only зеркало, любые POST/PUT/DELETE
    # отбиваем 405. Защита от случайного PUT'а через nginx_upload и пр.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Cache headers — клиенты (wrappers на нодах) и так используют
    # atomic-replace + sanity-check size, but браузеры тоже благодарны.
    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Health-endpoint для docker healthcheck и monitoring.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
