---
# Defaults для exit-side проверок WG-линка.
#
# Эту роль зовёт `playbooks/diagnose_relay_link.yml` ВТОРЫМ play'ом
# (после jump-side), когда `diag_check_types` содержит хоть одну
# exit-side проверку. Backend orchestrator передаёт extra_vars из
# `RelayExitLink` + `WGExitNode`. Defaults — для ручного запуска роли
# с минимальным набором аргументов.

# Полный набор exit-side checks. Backend фильтрует по
# `diag_check_types` (общий список jump+exit).
diag_exit_check_types_default:
  - peer_on_exit
  - iptables_forward

# Required extra_vars (orchestrator MUST pass):
#   diag_client_pubkey   — RelayExitLink.wg_client_public_key, ищем его
#                           среди peer'ов на exit'е (это relay со стороны
#                           exit'а — peer's pubkey, не exit's own pubkey)
#   diag_wg_iface_on_exit — обычно "wg0" — основной WG-интерфейс exit-ноды
#                           (NOT diag_wg_iface, тот — на jump-side: wgN)
#   diag_result_file_exit — путь куда роль пишет JSON-результат на
#                            контроллере (delegate_to: localhost)
diag_wg_iface_on_exit: "wg0"
