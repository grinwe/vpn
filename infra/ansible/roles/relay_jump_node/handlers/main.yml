---
# restart-on-change for WG interfaces is now done inline in tasks/main.yml
# (per-link, driven by register.changed). We only keep the xray handler
# since multiple tasks in the role can all notify one restart per run.
- name: restart all xray services
  shell: |
    for svc in xray xray-ws-cdn xray-xhttp; do
      if systemctl is-active --quiet "${svc}" 2>/dev/null; then
        systemctl restart "${svc}"
      fi
    done
  args:
    executable: /bin/bash

# Отдельный от xray-хендлера: hysteria — самостоятельный демон со своим
# юнитом, и рестартовать её надо только когда реально поменялись её секции
# (иначе каждый attach/detach рвал бы живые QUIC-сессии всех hy2-юзеров ноды).
# try-restart, а не restart: на ноде без hy2 юнита нет, и `-` от systemctl
# здесь не спасёт — ansible смотрит на rc.
- name: restart hysteria2 after relay change
  shell: |
    if systemctl is-active --quiet hysteria-server 2>/dev/null; then
      systemctl restart hysteria-server
    fi
  args:
    executable: /bin/bash
