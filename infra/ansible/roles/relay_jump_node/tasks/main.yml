---
# relay_jump_node
#
# Two-mode WireGuard client role for RU VPN nodes.
#
# Mode "enable" (relay_wg_private_key defined and non-empty):
#   - Install wireguard package.
#   - Render /etc/wireguard/wg0.conf from the provided vars.
#   - Start + enable wg-quick@wg0.
#   - Patch every /usr/local/etc/xray/config*.json freedom outbound
#     with sockopt.interface: wg0, so user traffic exits the tunnel
#     while SSH/Ansible stays on the main interface.
#
# Mode "disable" (relay_wg_private_key absent or empty):
#   - Stop + disable wg-quick@wg0 if /etc/wireguard/wg0.conf exists.
#   - Remove the config file.
#   - Unpatch Xray configs: strip streamSettings.sockopt from the
#     freedom outbound, but only when it's actually set (so a direct
#     node that never had relay config is a pure no-op).
#
# The role runs unconditionally from site.yml; gating happens here.
# This lets a node transition relay → direct in one ansible run by
# simply clearing ``VPNNode.relay_config`` (stage D.1 of the relay
# roadmap — RELAY_ROADMAP.md).

- name: Determine relay mode from input variables
  set_fact:
    relay_enabled: >-
      {{
        (relay_wg_private_key | default('')) | length > 0
        and (relay_wg_address_v4 | default('')) | length > 0
        and (relay_wg_endpoint | default('')) | length > 0
        and (relay_wg_exit_public_key | default('')) | length > 0
      }}

# ── ENABLE branch ────────────────────────────────────────────────
- name: Relay enable — set up WG client + patch Xray
  when: relay_enabled | bool
  block:
    - name: Install WireGuard
      apt:
        name: [wireguard, wireguard-tools]
        state: present
        update_cache: yes

    - name: Render WireGuard client config
      template:
        src: wg0-client.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: '0600'
      notify: restart wg0 client

    - name: Enable and start WireGuard client
      systemd:
        name: wg-quick@wg0
        enabled: yes
        state: started

    # Retry with backoff — after the exit peer list was (re)applied
    # earlier in the same relay_tunnel run, wg needs a few seconds to
    # handshake. If still down after ~30s, fail the play loudly so a
    # broken tunnel cannot masquerade as a successful bootstrap (which
    # is what the previous failed_when:false variant allowed — the
    # admin saw green, but client traffic silently timed out).
    - name: Test tunnel connectivity
      command: curl -s --interface wg0 --connect-timeout 5 https://ifconfig.me
      register: tunnel_test
      changed_when: false
      retries: 6
      delay: 5
      until: tunnel_test.rc == 0

    - name: Report tunnel status
      debug:
        msg: "WireGuard tunnel UP — exit IP: {{ tunnel_test.stdout }}"

    - name: Find existing xray configs
      find:
        paths: /usr/local/etc/xray
        patterns: "config*.json"
      register: xray_configs_enable

    - name: Patch Xray freedom outbound with sockopt.interface wg0
      shell: |
        set -euo pipefail
        CONFIG="{{ item.path }}"
        EXISTING=$(jq -r '
          (.outbounds[]? | select(.tag == "direct" and .protocol == "freedom"))
            | .streamSettings.sockopt.interface // ""
        ' "${CONFIG}")
        if [ "${EXISTING}" = "wg0" ]; then
          # Already patched — no change.
          exit 78
        fi
        TMP=$(mktemp)
        # Plain path-assign; the earlier form (path) |= .x = value is a
        # jq syntax error because |= cannot be chained into another =.
        jq '
          (.outbounds[] | select(.tag == "direct" and .protocol == "freedom")).streamSettings.sockopt = {
            "interface": "wg0",
            "tcpKeepAliveInterval": 30
          }
        ' "${CONFIG}" > "${TMP}"
        jq -e . "${TMP}" > /dev/null || { rm -f "${TMP}"; exit 1; }
        mv "${TMP}" "${CONFIG}"
        chown root:nogroup "${CONFIG}" 2>/dev/null || chown root:root "${CONFIG}"
        chmod 0640 "${CONFIG}"
      args:
        executable: /bin/bash
      loop: "{{ xray_configs_enable.files }}"
      register: patch_result
      changed_when: patch_result.rc == 0
      failed_when: patch_result.rc not in [0, 78]
      notify: restart all xray services

    - name: Find hysteria2 config
      stat:
        path: /etc/hysteria/config.yaml
      register: hy2_config

    # Hysteria2 is UDP and typically not blocked — it keeps exiting
    # directly. Moving it onto the tunnel would need policy routing.
    - name: Note about Hysteria2 on relay nodes
      debug:
        msg: >-
          Hysteria2 traffic exits directly (not through WG tunnel).
      when: hy2_config.stat.exists

# ── DISABLE branch ───────────────────────────────────────────────
- name: Relay disable — tear down WG client + unpatch Xray
  when: not (relay_enabled | bool)
  block:
    - name: Check if wg0 config exists
      stat:
        path: /etc/wireguard/wg0.conf
      register: wg0_conf_stat

    - name: Stop and disable wg-quick@wg0
      systemd:
        name: wg-quick@wg0
        state: stopped
        enabled: no
      failed_when: false
      when: wg0_conf_stat.stat.exists

    - name: Remove wg0 client config
      file:
        path: /etc/wireguard/wg0.conf
        state: absent

    - name: Find existing xray configs (disable mode)
      find:
        paths: /usr/local/etc/xray
        patterns: "config*.json"
      register: xray_configs_disable

    - name: Unpatch sockopt from Xray freedom outbound
      shell: |
        set -euo pipefail
        CONFIG="{{ item.path }}"
        HAS=$(jq -r '
          (.outbounds[]? | select(.tag == "direct" and .protocol == "freedom"))
            | (.streamSettings // {})
            | has("sockopt")
        ' "${CONFIG}")
        if [ "${HAS}" != "true" ]; then
          # No sockopt — nothing to strip. No-op on fresh direct nodes.
          exit 78
        fi
        TMP=$(mktemp)
        jq '
          (.outbounds[] | select(.tag == "direct" and .protocol == "freedom"))
            |= (del(.streamSettings.sockopt))
        ' "${CONFIG}" > "${TMP}"
        jq -e . "${TMP}" > /dev/null || { rm -f "${TMP}"; exit 1; }
        mv "${TMP}" "${CONFIG}"
        chown root:nogroup "${CONFIG}" 2>/dev/null || chown root:root "${CONFIG}"
        chmod 0640 "${CONFIG}"
      args:
        executable: /bin/bash
      loop: "{{ xray_configs_disable.files }}"
      register: unpatch_result
      changed_when: unpatch_result.rc == 0
      failed_when: unpatch_result.rc not in [0, 78]
      notify: restart all xray services
