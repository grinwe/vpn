---
# check_exit_health — read-only probe for a WG exit node.
#
# Mirrors check_node_health but collects exit-specific signals:
# wg0 interface state, per-peer handshake freshness, listening UDP
# socket, forwarding/NAT kernel state. Safe to run against a live
# exit — does not touch configs, services, or firewall rules.
#
# Used by playbooks/diagnose_exit.yml. The admin UI surfaces the
# task's stdout, so every check's output lands verbatim in the
# debug: blocks below.
#
# Layout rule (same as check_node_health): always collect diagnostics
# first, print them unconditionally, then assert. A failing assert at
# the end leaves the full dump visible above the failure line —
# crucial when debugging why `wg show` reports zero received packets
# even though the service is running.

- name: Probe WireGuard UDP listen port (non-fatal)
  wait_for:
    port: "{{ wg_exit_port | default(51820) }}"
    timeout: 5
  register: wg_port_probe
  failed_when: false

- name: Gather wg0 interface + peers
  # `wg show wg0` prints public key, listen port, each peer's endpoint,
  # allowed-ips and latest handshake. A peer with "latest handshake" ==
  # "never" or older than 3 min is effectively disconnected. That's the
  # single most useful signal when debugging an exit.
  shell: "wg show wg0 2>&1 || true"
  args:
    executable: /bin/bash
  register: wg_show
  changed_when: false

- name: Gather wg-quick@wg0 systemd state
  shell: |
    systemctl status wg-quick@wg0 --no-pager --lines=0 2>&1 || true
    echo "---- recent journal ----"
    journalctl -u wg-quick@wg0 --no-pager -n 30 2>&1 || true
  args:
    executable: /bin/bash
  register: wg_systemd
  changed_when: false

- name: Gather listening UDP sockets
  shell: "ss -ulnp 2>&1 || true"
  args:
    executable: /bin/bash
  register: udp_sockets
  changed_when: false

- name: Gather wg0 addressing + routing
  shell: |
    echo "=== ip addr show wg0 ==="
    ip addr show wg0 2>&1 || true
    echo
    echo "=== ip route ==="
    ip route 2>&1 || true
    echo
    echo "=== iptables -t nat -S POSTROUTING ==="
    iptables -t nat -S POSTROUTING 2>&1 || true
  args:
    executable: /bin/bash
  register: wg_netstate
  changed_when: false

- name: Gather forwarding sysctl
  shell: "sysctl net.ipv4.ip_forward net.ipv6.conf.all.forwarding 2>&1 || true"
  args:
    executable: /bin/bash
  register: wg_sysctl
  changed_when: false

- name: Show wg0 interface state
  debug:
    var: wg_show.stdout_lines

- name: Show wg-quick@wg0 service state
  debug:
    var: wg_systemd.stdout_lines

- name: Show listening UDP sockets
  debug:
    var: udp_sockets.stdout_lines

- name: Show wg0 addressing + routing
  debug:
    var: wg_netstate.stdout_lines

- name: Show forwarding sysctl
  debug:
    var: wg_sysctl.stdout_lines

- name: Fail if WG listen port is not open
  # Runs LAST so the diagnostic dump above is always visible. A closed
  # port means wg-quick@wg0 isn't running or UFW dropped it — the
  # systemctl/journal output above usually pins down which.
  assert:
    that:
      - wg_port_probe.failed is not defined or not wg_port_probe.failed
    fail_msg: >-
      WireGuard UDP port {{ wg_exit_port | default(51820) }} is not
      listening. See the "Show wg-quick@wg0 service state" and
      "Show listening UDP sockets" output above for the root cause.
  # Diagnose mode collects the structured result below regardless of port
  # state, so don't abort here when an admin explicitly requested a probe.
  when: diag_result_file is not defined

# ── Structured diagnose capture ─────────────────────────────────────────
# Only the orchestrator's diagnose_exit.yml passes `diag_result_file`.
# A normal site.yml run leaves it undefined, so the whole block below is
# skipped and behaviour is unchanged. Each probe is `failed_when: false` +
# register, then appended to `diag_collected_checks`; the final task
# serializes the batch to a controller-side JSON file the backend parser
# merges into the task result. Mirrors roles/diagnose_relay_link/tasks/main.yml.
- name: "diagnose :: structured exit checks"
  when: diag_result_file is defined
  block:
    - name: "diagnose :: init result accumulator"
      ansible.builtin.set_fact:
        diag_collected_checks: []

    # ── wg_interface (wg show → ok/fail) ────────────────────────────────
    # `wg show wg0 dump` exits non-zero when the interface doesn't exist;
    # success means the WireGuard device is up.
    - name: "diagnose :: wg_interface — wg show wg0 dump"
      ansible.builtin.command: "wg show wg0 dump"
      register: diag_wg_dump
      changed_when: false
      failed_when: false

    - name: "diagnose :: wg_interface — append result"
      ansible.builtin.set_fact:
        diag_collected_checks: "{{ diag_collected_checks + [diag_iface_entry] }}"
      vars:
        diag_iface_entry:
          name: wg_interface
          status: "{{ 'ok' if (diag_wg_dump.rc == 0) else 'fail' }}"
          latency_ms: null
          message: >-
            {%- if diag_wg_dump.rc == 0 -%}
            интерфейс wg0 поднят
            {%- else -%}
            wg show wg0 fail (rc={{ diag_wg_dump.rc }}) — интерфейс не существует: {{ (diag_wg_dump.stderr | default(''))[:200] }}
            {%- endif -%}
          details:
            rc: "{{ diag_wg_dump.rc }}"
            stderr: "{{ (diag_wg_dump.stderr | default(''))[:300] }}"

    # ── wg_peers (peer count → ok / warn if 0) ──────────────────────────
    # `wg show wg0 dump` без 'all': line 1 = header (priv/pub/port/fwmark),
    # каждая последующая строка = один peer. Считаем непустые строки минус
    # header. rc!=0 → интерфейса нет → 0 peers.
    - name: "diagnose :: wg_peers — append result"
      ansible.builtin.set_fact:
        diag_collected_checks: "{{ diag_collected_checks + [diag_peers_entry] }}"
      vars:
        diag_peer_count: >-
          {{ ([(diag_wg_dump.stdout_lines | default([]) | length) - 1, 0] | max)
             if (diag_wg_dump.rc == 0) else 0 }}
        diag_peers_entry:
          name: wg_peers
          status: "{{ 'ok' if (diag_peer_count | int > 0) else 'warn' }}"
          latency_ms: null
          message: >-
            {%- if (diag_peer_count | int > 0) -%}
            peers на wg0: {{ diag_peer_count }}
            {%- else -%}
            на wg0 нет ни одного peer — relay-линки не подключены
            {%- endif -%}
          details:
            peer_count: "{{ diag_peer_count | int }}"
            dump_lines: "{{ diag_wg_dump.stdout_lines | default([]) | length }}"

    # ── ip_forward (sysctl net.ipv4.ip_forward == 1 → ok/fail) ──────────
    - name: "diagnose :: ip_forward — read sysctl"
      ansible.builtin.command: "sysctl -n net.ipv4.ip_forward"
      register: diag_ipfwd
      changed_when: false
      failed_when: false

    - name: "diagnose :: ip_forward — append result"
      ansible.builtin.set_fact:
        diag_collected_checks: "{{ diag_collected_checks + [diag_ipfwd_entry] }}"
      vars:
        diag_ipfwd_val: "{{ diag_ipfwd.stdout | default('') | trim }}"
        diag_ipfwd_entry:
          name: ip_forward
          status: "{{ 'ok' if (diag_ipfwd_val == '1') else 'fail' }}"
          latency_ms: null
          message: >-
            {%- if diag_ipfwd_val == '1' -%}
            net.ipv4.ip_forward = 1 (forwarding включён)
            {%- else -%}
            net.ipv4.ip_forward = {{ diag_ipfwd_val | default('?') }} — forwarding выключен, exit не маршрутизирует трафик
            {%- endif -%}
          details:
            value: "{{ diag_ipfwd_val }}"
            rc: "{{ diag_ipfwd.rc | default(-1) }}"

    # ── wg_listen_port (UDP-сокет wg-порта → ok/fail) ───────────────────
    - name: "diagnose :: wg_listen_port — ss -ulnp"
      ansible.builtin.shell: "ss -ulnp 2>/dev/null | grep -E ':{{ wg_exit_port | default(51820) }}([^0-9]|$)' || true"
      args:
        executable: /bin/bash
      register: diag_wgport
      changed_when: false
      failed_when: false

    - name: "diagnose :: wg_listen_port — append result"
      ansible.builtin.set_fact:
        diag_collected_checks: "{{ diag_collected_checks + [diag_wgport_entry] }}"
      vars:
        diag_wgport_ok: "{{ (diag_wgport.stdout | default('') | trim) | length > 0 }}"
        diag_wgport_entry:
          name: wg_listen_port
          status: "{{ 'ok' if diag_wgport_ok else 'fail' }}"
          latency_ms: null
          message: >-
            {%- if diag_wgport_ok -%}
            UDP-порт {{ wg_exit_port | default(51820) }} слушает (WireGuard)
            {%- else -%}
            нет UDP-сокета на {{ wg_exit_port | default(51820) }} — wg-quick@wg0 не поднят либо firewall режет
            {%- endif -%}
          details:
            port: "{{ wg_exit_port | default(51820) }}"
            socket: "{{ (diag_wgport.stdout | default(''))[:200] }}"

    # ── nat_masquerade (MASQUERADE/SNAT на egress → ok/fail) ────────────
    # Без NAT трафик из WG-туннеля уходит наружу с приватным src и не
    # вернётся — самый частый «handshake есть, инета нет» на свежем exit'е.
    - name: "diagnose :: nat_masquerade — gather POSTROUTING"
      ansible.builtin.shell: |
        set -o pipefail
        iptables -t nat -S POSTROUTING 2>/dev/null || true
        nft list ruleset 2>/dev/null | grep -iE 'masquerade|snat' || true
      args:
        executable: /bin/bash
      register: diag_nat
      changed_when: false
      failed_when: false

    - name: "diagnose :: nat_masquerade — append result"
      ansible.builtin.set_fact:
        diag_collected_checks: "{{ diag_collected_checks + [diag_nat_entry] }}"
      vars:
        diag_nat_lines: >-
          {{ diag_nat.stdout_lines | default([]) | select('search', '(?i)masquerade|snat') | list }}
        diag_nat_ok: "{{ diag_nat_lines | length > 0 }}"
        diag_nat_entry:
          name: nat_masquerade
          status: "{{ 'ok' if diag_nat_ok else 'fail' }}"
          latency_ms: null
          message: >-
            {%- if diag_nat_ok -%}
            MASQUERADE/SNAT есть ({{ diag_nat_lines | length }} правил) — egress NAT настроен
            {%- else -%}
            в POSTROUTING нет MASQUERADE/SNAT — трафик из туннеля не наатится наружу, инета у юзеров не будет
            {%- endif -%}
          details:
            rule_count: "{{ diag_nat_lines | length }}"
            samples: "{{ (diag_nat_lines | default([]))[:4] }}"

    # ── internet_egress (реально ли exit выходит в инет) ────────────────
    - name: "diagnose :: internet_egress — curl 1.1.1.1"
      ansible.builtin.shell: "curl -s -o /dev/null -w '%{http_code}' --max-time 7 https://1.1.1.1 2>/dev/null || echo 000"
      args:
        executable: /bin/bash
      register: diag_egress
      changed_when: false
      failed_when: false

    - name: "diagnose :: internet_egress — append result"
      ansible.builtin.set_fact:
        diag_collected_checks: "{{ diag_collected_checks + [diag_egress_entry] }}"
      vars:
        diag_egress_code: "{{ (diag_egress.stdout | default('000') | trim) }}"
        diag_egress_ok: "{{ diag_egress_code[:1] in ['2', '3'] }}"
        diag_egress_entry:
          name: internet_egress
          status: "{{ 'ok' if diag_egress_ok else 'fail' }}"
          latency_ms: null
          message: >-
            {%- if diag_egress_ok -%}
            exit выходит в интернет (https://1.1.1.1 → HTTP {{ diag_egress_code }})
            {%- else -%}
            exit НЕ выходит в интернет (код {{ diag_egress_code }}) — маршрут/NAT/DNS на exit'е битый или нет аптайма; юзеры за этим exit'ом без инета
            {%- endif -%}
          details:
            http_code: "{{ diag_egress_code }}"

    # ── dns_resolve (DNS работает с exit → ok/warn) ─────────────────────
    - name: "diagnose :: dns_resolve — getent"
      ansible.builtin.shell: "getent ahosts one.one.one.one 2>/dev/null | head -1 || true"
      args:
        executable: /bin/bash
      register: diag_dns
      changed_when: false
      failed_when: false

    - name: "diagnose :: dns_resolve — append result"
      ansible.builtin.set_fact:
        diag_collected_checks: "{{ diag_collected_checks + [diag_dns_entry] }}"
      vars:
        diag_dns_ok: "{{ (diag_dns.stdout | default('') | trim) | length > 0 }}"
        diag_dns_entry:
          name: dns_resolve
          status: "{{ 'ok' if diag_dns_ok else 'warn' }}"
          latency_ms: null
          message: >-
            {%- if diag_dns_ok -%}
            DNS резолвится с exit'а ({{ (diag_dns.stdout | default('') | trim).split(' ')[0] }})
            {%- else -%}
            DNS НЕ резолвится с exit'а — resolv.conf/файрвол на :53; egress может «вроде есть», но имена не открываются
            {%- endif -%}
          details:
            sample: "{{ (diag_dns.stdout | default(''))[:120] }}"

    # ── conntrack (заполнение таблицы → ok/warn/info) ───────────────────
    - name: "diagnose :: conntrack — count vs max"
      ansible.builtin.shell: |
        c=$(cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null || echo -1)
        m=$(cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null || echo -1)
        echo "$c $m"
      args:
        executable: /bin/bash
      register: diag_ct
      changed_when: false
      failed_when: false

    - name: "diagnose :: conntrack — append result"
      ansible.builtin.set_fact:
        diag_collected_checks: "{{ diag_collected_checks + [diag_ct_entry] }}"
      vars:
        diag_ct_count: "{{ (diag_ct.stdout | default('-1 -1') | trim).split(' ')[0] | int }}"
        diag_ct_max: "{{ (diag_ct.stdout | default('-1 -1') | trim).split(' ')[1] | int }}"
        diag_ct_pct: "{{ ((diag_ct_count | int) * 100 // (diag_ct_max | int)) if (diag_ct_max | int) > 0 else -1 }}"
        diag_ct_entry:
          name: conntrack
          status: >-
            {%- if (diag_ct_max | int) <= 0 -%}info
            {%- elif (diag_ct_pct | int) >= 85 -%}warn
            {%- else -%}ok
            {%- endif -%}
          latency_ms: null
          message: >-
            {%- if (diag_ct_max | int) <= 0 -%}
            conntrack не загружен (модуль не активен) — обычно ок для чистого forwarding
            {%- elif (diag_ct_pct | int) >= 85 -%}
            conntrack заполнен на {{ diag_ct_pct }}% ({{ diag_ct_count }}/{{ diag_ct_max }}) — близко к дропам новых соединений
            {%- else -%}
            conntrack {{ diag_ct_pct }}% ({{ diag_ct_count }}/{{ diag_ct_max }})
            {%- endif -%}
          details:
            count: "{{ diag_ct_count }}"
            max: "{{ diag_ct_max }}"
            pct: "{{ diag_ct_pct }}"

    # ── Финал: пишем структурированный JSON на контроллер ───────────────
    # Backend orchestrator (_parse_diagnose_result_file) прочитает файл и
    # подмержит checks в ProvisioningTask.result. delegate_to localhost —
    # пишем на стороне контроллера, не на exit-ноде.
    - name: "diagnose :: write structured result to controller"
      ansible.builtin.copy:
        content: "{{ {'checks': diag_collected_checks} | to_nice_json }}"
        dest: "{{ diag_result_file }}"
        mode: "0644"
      delegate_to: localhost
      become: false
