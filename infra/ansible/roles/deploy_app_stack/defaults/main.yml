---
# Controller-side path to the ``vpn/`` repo root. Computed relative
# to this role's own location so it works no matter which playbook
# entry point invoked the role. Override only if you're running from
# a checkout that doesn't follow the standard layout.
deploy_app_stack_repo_src: "{{ role_path }}/../../../.."

# Where the repo is synced to on the target. Everything the compose
# stack needs (backend/, bot/, admin/, infra/, docker-compose.yml)
# lives under this directory; nothing is baked into images at build
# time that the role would need to mutate later.
deploy_app_stack_dir: "/opt/vpn"

# Unix user that owns the synced tree. Kept as root for now — the
# compose stack runs as root inside the daemon anyway, and the
# provisioning SSH key needs root-readable perms.
deploy_app_stack_owner: "root"
deploy_app_stack_group: "root"

# Path on the target where the provisioning SSH private key should
# live. The worker container bind-mounts this read-only at
# /run/secrets/provisioning_key. The role copies it there from the
# controller-side path in ``deploy_app_stack_provisioning_key_src``.
deploy_app_stack_provisioning_key_dst: "/opt/vpn/secrets/provisioning_key"
deploy_app_stack_provisioning_key_src: ""

# Whether to run ``docker compose build`` before ``up``. Turn off if
# you prefer to pre-build images in CI and only pull here — in that
# case, point the compose file at a registry instead.
deploy_app_stack_build: true

# Force a full recreate on every run (``--force-recreate``). Off by
# default so idempotent re-runs are cheap; compose will recreate only
# what changed. Flip to true via --extra-vars if you want a clean bounce.
deploy_app_stack_force_recreate: false

# --- Secrets expected from group_vars/vault ---
# These MUST be supplied before the role will run. The role asserts
# their presence up front so a half-templated .env never lands on disk.
#
#   deploy_app_stack_postgres_password
#   deploy_app_stack_admin_api_token
#   deploy_app_stack_app_secret_key
#   deploy_app_stack_bot_token
#   deploy_app_stack_admin_ids              (comma-separated telegram ids)
#
# Optional (leave empty string to disable the corresponding feature):
#   deploy_app_stack_telegram_stars_webhook_secret
#   deploy_app_stack_payment_provider        (default: "cryptobot")
deploy_app_stack_payment_provider: "cryptobot"
deploy_app_stack_telegram_stars_webhook_secret: ""

# Admin SPA base path. Default "admin" keeps the legacy /admin/ URL;
# override via vault_admin_secret_path in group_vars/web/vault.yml to
# bury the panel behind a secret path (anti-probing — see docs). Must
# match deploy_web_frontend_admin_path so nginx and the admin container
# agree on the exposed prefix. Change triggers docker image rebuild.
deploy_app_stack_admin_base_path: "{{ vault_admin_secret_path | default('admin') }}"

# Telegram WebApp / Mini App.
#
#   deploy_app_stack_webapp_jwt_secret  — REQUIRED, min 32 chars.
#                                         Generate once on the controller:
#                                           python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
#                                         then store in group_vars/<group>/vault.yml.
#                                         Rotating it invalidates all live WebApp sessions
#                                         (users will re-auth via Telegram on next open).
#
#   deploy_app_stack_webapp_base_url    — public HTTPS URL of the WebApp,
#                                         e.g. https://grinwer.online/app.
#                                         Used by the bot to construct
#                                         WebAppInfo / Direct Link buttons.
deploy_app_stack_webapp_base_url: "https://{{ deploy_web_frontend_domain | default('grinwer.online') }}/app"
deploy_app_stack_webapp_jwt_ttl_seconds: 1800

# ── WS+CDN / xhttp DNS front (Cloudflare DNS-only, no proxy) ───────────
# CF is used ONLY as a DNS host: the backend mints a random DNS-only
# (grey-cloud) A-record <rand>.wgse.info → node IP; the node serves TLS
# itself via Let's Encrypt. CF-proxying ws/xhttp is dead (RKN; see
# project_cf_ws_cdn_dead) — the Origin-CA vars are gone, no CF cert anymore.
# Leave vault_cloudflare_api_token empty to disable DNS fronting. NB: the
# token must still cover grwr.ink until the old CF-proxied xhttp records
# are torn down (teardown resolves the zone from the stored cf_front_domain).
deploy_app_stack_cloudflare_dns_token: "{{ vault_cloudflare_api_token | default('') }}"
deploy_app_stack_wscdn_front_domain: "{{ vault_wscdn_front_domain | default('wgse.info') }}"

# ── Provisioning reconciler (desired-state convergence) ────────────────
# Master-тумблер + тунаблы reconcile-модели. Безопасный role-дефолт OFF;
# прод включает через group_vars/web/main.yml (deploy_app_stack_reconciler_enabled: "1").
# См. docs/operations/provisioning_reconciler_epic.md.
deploy_app_stack_reconciler_enabled: "0"
deploy_app_stack_reconcile_interval: 10
deploy_app_stack_reconcile_debounce_s: 5
deploy_app_stack_reconcile_max_per_tick: 5
deploy_app_stack_reconcile_retry_s: 60
