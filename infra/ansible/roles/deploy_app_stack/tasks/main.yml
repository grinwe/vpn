---
# Pre-flight: refuse to run with placeholder secrets. Every one of
# these ends up in the rendered .env or a bind-mounted file, so a bad
# value means the stack comes up broken (or worse, comes up with a
# known-default password).
- name: Assert required secrets are set
  assert:
    that:
      - deploy_app_stack_postgres_password | default('', true) | length >= 12
      - deploy_app_stack_admin_api_token | default('', true) | length >= 20
      - deploy_app_stack_app_secret_key | default('', true) | length >= 16
      - deploy_app_stack_bot_token | default('', true) | length > 0
      - deploy_app_stack_admin_ids | default('', true) | length > 0
      - deploy_app_stack_webapp_jwt_secret | default('', true) | length >= 32
    fail_msg: >
      Missing or too-short secret. Check group_vars/*/vault.yml —
      every deploy_app_stack_* secret must be set and non-trivial.

# Some hosts already have Docker from a sibling role (e.g. the CDN
# stack in vpn-setup installs docker-ce + containerd.io from docker.com
# directly). Installing docker.io on top of that blows up because
# Ubuntu's containerd package conflicts with containerd.io. So we probe
# for an existing docker binary first and only install from the distro
# repo on truly fresh hosts.
- name: Check if docker is already installed
  command: docker --version
  register: _docker_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install docker engine and compose plugin (fresh hosts only)
  apt:
    name:
      - docker.io
      - docker-compose-v2
      - rsync
    state: present
    update_cache: true
  when: _docker_probe.rc != 0

- name: Ensure rsync is installed
  apt:
    name: rsync
    state: present
  when: _docker_probe.rc == 0

- name: Ensure docker service is running
  service:
    name: docker
    state: started
    enabled: true

- name: Ensure app directory exists
  file:
    path: "{{ deploy_app_stack_dir }}"
    state: directory
    owner: "{{ deploy_app_stack_owner }}"
    group: "{{ deploy_app_stack_group }}"
    mode: "0750"

- name: Ensure secrets directory exists
  file:
    path: "{{ deploy_app_stack_dir }}/secrets"
    state: directory
    owner: "{{ deploy_app_stack_owner }}"
    group: "{{ deploy_app_stack_group }}"
    mode: "0700"

# Sync the whole repo. We exclude vcs, build artefacts, and anything
# that would bloat the transfer or leak controller-local secrets. The
# list is conservative — if in doubt, exclude it.
- name: Sync repository to target
  synchronize:
    src: "{{ deploy_app_stack_repo_src }}/"
    dest: "{{ deploy_app_stack_dir }}/"
    recursive: true
    delete: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.github"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.pytest_cache"
      - "--exclude=admin/node_modules"
      - "--exclude=admin/dist"
      - "--exclude=webapp/node_modules"
      - "--exclude=webapp/dist"
      - "--exclude=backend/.venv"
      - "--exclude=bot/.venv"
      - "--exclude=.env"
      - "--exclude=.env.*"
      - "--exclude=secrets/"
      # Маркер успешного build живёт внутри dest — исключаем из
      # --delete, иначе rsync стирал бы его на каждом прогоне.
      - "--exclude=.built_ok"
  register: repo_sync
  notify: recreate app stack

- name: Render .env for docker-compose
  template:
    src: env.j2
    dest: "{{ deploy_app_stack_dir }}/.env"
    owner: "{{ deploy_app_stack_owner }}"
    group: "{{ deploy_app_stack_group }}"
    mode: "0600"
  notify: recreate app stack

# The worker container needs an SSH private key to reach VPN nodes.
# We accept either (a) a controller-side path to the key file or
# (b) nothing, in which case the worker comes up but provisioning
# will fail loudly — fine for first-time bootstrap before the key
# exists.
- name: Install provisioning SSH key (if provided)
  copy:
    src: "{{ deploy_app_stack_provisioning_key_src }}"
    dest: "{{ deploy_app_stack_provisioning_key_dst }}"
    owner: "{{ deploy_app_stack_owner }}"
    group: "{{ deploy_app_stack_group }}"
    mode: "0600"
  when: deploy_app_stack_provisioning_key_src | length > 0
  notify: recreate app stack

# Крах-безопасная идемпотентность билда. Гейтить build только на
# repo_sync.changed нельзя: если прогон упал ПОСЛЕ rsync, но ДО/ВО
# ВРЕМЯ build (обрыв сети до registry, OOM, Ctrl-C), повторный запуск
# увидит changed=false → пропустит build → `up -d` поднимет старые
# образы, а healthcheck и assert пройдут. Поэтому «нужен rebuild»
# делаем персистентным через маркер .built_ok: сбрасываем его при
# любом изменении дерева и записываем заново ТОЛЬКО после успешного
# build. Пока маркера нет — перестраиваемся.
- name: Invalidate build marker when repo changed
  file:
    path: "{{ deploy_app_stack_dir }}/.built_ok"
    state: absent
  when: repo_sync.changed

- name: Check build marker
  stat:
    path: "{{ deploy_app_stack_dir }}/.built_ok"
  register: _build_marker

- name: Build docker images
  # Rebuild when the synced tree changed (marker invalidated above) or
  # a previous build never finished (marker missing). Re-running the
  # role against an unchanged, successfully-built repo is then free.
  command: docker compose build --no-cache
  args:
    chdir: "{{ deploy_app_stack_dir }}"
  when:
    - deploy_app_stack_build | bool
    - not _build_marker.stat.exists
  changed_when: true

# Пишем маркер только после успеха build. Если build упал, Ansible
# прервёт плей до этой задачи → маркера нет → следующий прогон
# перестроит образы даже при неизменном дереве.
- name: Record successful build marker
  copy:
    dest: "{{ deploy_app_stack_dir }}/.built_ok"
    content: "built\n"
    owner: "{{ deploy_app_stack_owner }}"
    group: "{{ deploy_app_stack_group }}"
    mode: "0640"
  when:
    - deploy_app_stack_build | bool
    - not _build_marker.stat.exists

- name: Bring the stack up
  command: >
    docker compose up -d
    {{ '--force-recreate' if deploy_app_stack_force_recreate | bool else '' }}
  args:
    chdir: "{{ deploy_app_stack_dir }}"
  changed_when: true

- name: Wait for backend to be healthy
  uri:
    url: "http://127.0.0.1:8000/healthz"
    status_code: 200
  register: backend_health
  retries: 30
  delay: 2
  until: backend_health.status == 200

# ``backend`` having a /healthz endpoint is enough to gate on, but the
# bot and worker containers have no HTTP surface — so a classic crash
# loop (wrong config, aiogram API drift, whatever) leaves the playbook
# green while the process restart-loops forever. Give docker a chance
# to settle, then refuse to declare success if any of our compose
# services are in a Restarting state.
- name: Settle compose (give crash loops time to become visible)
  pause:
    seconds: 10

- name: Collect compose service status
  command: docker compose ps --format '{% raw %}{{.Name}} {{.State}}{% endraw %}'
  args:
    chdir: "{{ deploy_app_stack_dir }}"
  register: compose_ps
  changed_when: false

- name: Fail if any compose service is restarting or exited
  assert:
    that:
      - "'restarting' not in compose_ps.stdout | lower"
      - "'exited' not in compose_ps.stdout | lower"
    fail_msg: |
      One or more app-stack containers are unhealthy:
      {{ compose_ps.stdout }}
