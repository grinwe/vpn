---
# Disaster-recovery: вытащить с каждой ноды xray-овый config.json
# целиком, положить на контроллер для последующего парсинга. Роль
# умышленно read-only — никакого state mutation на нодах, чтобы
# случайно не убить ещё и xray.
#
# Используется после потери контрол-хоста: на нодах остался
# актуальный список (email = "user-{user_id}-{subscription_id}", uuid,
# flow) — это всё, что нужно, чтобы пересобрать таблицы User /
# Subscription / Device в новой БД. См. playbook + aggregate script.

# Дать транзиентным SSH-таймаутам пару попыток, прежде чем считать
# хост unreachable. Если хост реально умер — wait_for_connection
# отвалится по timeout и play (с ignore_unreachable: yes на уровне
# play'я) перейдёт к следующему. Без этого один просевший хост
# дропает половину выгрузки.
- name: Wait for SSH (retry transient timeouts)
  ansible.builtin.wait_for_connection:
    delay: 0
    timeout: 60
    sleep: 5
  ignore_errors: yes
  ignore_unreachable: yes

- name: Probe xray config candidates on {{ inventory_hostname }}
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ recover_xray_inventory_config_candidates }}"
  register: _xray_cfg_probe
  changed_when: false
  retries: 3
  delay: 10
  until: _xray_cfg_probe is succeeded
  ignore_unreachable: yes

- name: Collect all existing config paths
  # ВАЖНО: берём ВСЕ найденные, а не первый. Каждый протокол (reality,
  # xhttp, ws_cdn) — отдельный xray-инстанс со своим config-файлом и
  # своим clients[]. Раньше брали только первый и теряли 2/3 юзеров.
  ansible.builtin.set_fact:
    _xray_cfg_paths: >-
      {{
        _xray_cfg_probe.results
        | selectattr('stat.exists', 'equalto', true)
        | map(attribute='item') | list
      }}

- name: Warn (don't fail) if no xray config found
  ansible.builtin.debug:
    msg: >-
      No xray config.json found on {{ inventory_hostname }} (checked:
      {{ recover_xray_inventory_config_candidates | join(', ') }}).
      Node will be skipped in aggregation.
  when: _xray_cfg_paths | length == 0

- name: Slurp every existing xray config
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ _xray_cfg_paths }}"
  loop_control:
    label: "{{ item }}"
  register: _xray_cfg_slurps
  when: _xray_cfg_paths | length > 0
  retries: 3
  delay: 10
  until: _xray_cfg_slurps is succeeded
  ignore_unreachable: yes

- name: Ensure recovery output dir exists on controller
  ansible.builtin.file:
    path: "{{ recover_xray_inventory_output_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Write per-protocol config copies to controller
  # Имя файла: <host>__<config_basename>. Например:
  #   ru-pq-01__config.json         (vless-reality)
  #   ru-pq-01__config_xhttp.json   (vless-xhttp)
  #   ru-pq-01__config_ws_cdn.json  (vless-ws-cdn)
  # Aggregator парсит это имя, чтобы знать какая нода и какой протокол.
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: >-
      {{ recover_xray_inventory_output_dir }}/{{ inventory_hostname }}__{{
        item.source | basename
      }}
    mode: "0644"
  loop: "{{ _xray_cfg_slurps.results | default([]) }}"
  loop_control:
    label: "{{ item.source | default('?') }}"
  delegate_to: localhost
  become: false
  when:
    - _xray_cfg_slurps is defined
    - item.content is defined
