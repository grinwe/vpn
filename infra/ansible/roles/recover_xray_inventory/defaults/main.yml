---
# На каждой ноде может крутиться НЕСКОЛЬКО xray-инстансов, по одному
# на VLESS-протокол, у каждого свой config-файл:
#   config.json         — vless-reality (основной)
#   config_xhttp.json   — vless-xhttp
#   config_ws_cdn.json  — vless-ws-cdn
# Клиенты НЕ дублируются между файлами — каждый протокол ведёт свой
# собственный clients[]. Поэтому собираем все возможные пути.
recover_xray_inventory_config_candidates:
  - /usr/local/etc/xray/config.json
  - /usr/local/etc/xray/config_xhttp.json
  - /usr/local/etc/xray/config_ws_cdn.json
  - /etc/xray/config.json
  - /opt/xray/config.json

# Куда положить выгруженные конфиги. Это путь НА КОНТРОЛЛЕРЕ
# (delegate_to: localhost). По умолчанию /tmp/xray-recovery — безопасно
# и не оставляет следов в репо. Playbook recover_xray_inventory.yml
# переопределяет это на стабильный путь рядом с собой.
recover_xray_inventory_output_dir: /tmp/xray-recovery
