---
# Relay→exit WireGuard link diagnostics.
#
# Each check is a discrete block guarded by `when: '<name>' in diag_check_types`
# so the orchestrator can selectively run a subset (e.g. only handshake_age
# on a stale-link auto-trigger) without re-running the rest. Result of every
# check is appended to `diag_collected_checks` as a dict so the final task
# can serialize the whole batch as one structured JSON file — that's what
# the admin UI renders, not the raw stdout below.
#
# Why per-check `failed_when: false`:
#   The whole point is to DIAGNOSE a broken link. A failing `ping` or a
#   missing peer is the SIGNAL we want to capture, not an error that
#   should abort the play. The final task always succeeds; the UI shows
#   the per-check status badges.

- name: Initialize result accumulator
  ansible.builtin.set_fact:
    diag_collected_checks: []
    diag_started_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

# ── peer_on_jump + handshake_age share one `wg show dump` call ──────────
# These two checks both need the wg dump output, so we collect it once
# and let each check inspect the same captured stdout.
- name: Collect wg show dump (used by peer_on_jump + handshake_age)
  ansible.builtin.command: "wg show {{ diag_wg_iface }} dump"
  register: diag_wg_dump
  changed_when: false
  failed_when: false
  when:
    - "('peer_on_jump' in diag_check_types) or ('handshake_age' in diag_check_types)"
  tags:
    - peer_on_jump
    - handshake_age

# ── peer_on_jump ────────────────────────────────────────────────────────
- name: "peer_on_jump :: filter dump lines matching exit pubkey"
  ansible.builtin.set_fact:
    diag_peer_lines: >-
      {{ diag_wg_dump.stdout_lines | default([])
         | select('search', diag_exit_pubkey) | list }}
  when: "'peer_on_jump' in diag_check_types"
  tags: peer_on_jump

- name: "peer_on_jump :: compose status"
  ansible.builtin.set_fact:
    diag_peer_status: "{{ 'ok' if (diag_peer_lines | length > 0) else 'fail' }}"
    diag_peer_message: >-
      {%- if (diag_peer_lines | length > 0) -%}
      peer present на {{ diag_wg_iface }}
      {%- else -%}
      peer {{ diag_exit_pubkey[:12] }}… NOT FOUND в {{ diag_wg_iface }} (wg dump rc={{ diag_wg_dump.rc | default(-1) }})
      {%- endif -%}
  when: "'peer_on_jump' in diag_check_types"
  tags: peer_on_jump

- name: "peer_on_jump :: append result"
  ansible.builtin.set_fact:
    diag_collected_checks: "{{ diag_collected_checks + [diag_peer_entry] }}"
  vars:
    diag_peer_entry:
      name: peer_on_jump
      status: "{{ diag_peer_status }}"
      latency_ms: null
      message: "{{ diag_peer_message }}"
      details:
        wg_dump_rc: "{{ diag_wg_dump.rc | default(-1) }}"
        wg_dump_lines: "{{ diag_wg_dump.stdout_lines | default([]) | length }}"
        exit_pubkey_prefix: "{{ diag_exit_pubkey[:12] }}"
        stderr: "{{ (diag_wg_dump.stderr | default(''))[:300] }}"
  when: "'peer_on_jump' in diag_check_types"
  tags: peer_on_jump

# ── handshake_age ───────────────────────────────────────────────────────
# wg dump peer line: iface\tpeer_pub\tpreshared\tendpoint\tallowed_ips\thandshake\trx\ttx\tkeepalive
# Field index 5 (0-based) = unix-epoch handshake (0 means never observed).
- name: "handshake_age :: filter peer lines"
  ansible.builtin.set_fact:
    diag_hs_lines: >-
      {{ diag_wg_dump.stdout_lines | default([])
         | select('search', diag_exit_pubkey) | list }}
  when: "'handshake_age' in diag_check_types"
  tags: handshake_age

- name: "handshake_age :: extract epoch"
  ansible.builtin.set_fact:
    diag_hs_epoch: >-
      {{ (diag_hs_lines[0].split('\t')[5] | int)
         if (diag_hs_lines | length > 0) else 0 }}
  when: "'handshake_age' in diag_check_types"
  tags: handshake_age

- name: "handshake_age :: compute age in seconds"
  ansible.builtin.set_fact:
    diag_hs_age_sec: >-
      {{ ((lookup('pipe', 'date -u +%s') | int) - (diag_hs_epoch | int))
         if (diag_hs_epoch | int) > 0 else -1 }}
  when: "'handshake_age' in diag_check_types"
  tags: handshake_age

- name: "handshake_age :: determine status"
  ansible.builtin.set_fact:
    diag_hs_status: >-
      {%- if (diag_hs_lines | length == 0) -%}fail
      {%- elif (diag_hs_epoch | int) == 0 -%}fail
      {%- elif (diag_hs_age_sec | int) > (diag_handshake_fail_min | int) * 60 -%}fail
      {%- elif (diag_hs_age_sec | int) > (diag_handshake_warn_min | int) * 60 -%}warn
      {%- else -%}ok
      {%- endif -%}
    diag_hs_message: >-
      {%- if (diag_hs_lines | length == 0) -%}
      peer не найден в wg dump — нечего проверять
      {%- elif (diag_hs_epoch | int) == 0 -%}
      handshake никогда не проходил — peer есть, но рукопожатие не состоялось (firewall/UDP?)
      {%- else -%}
      handshake {{ (diag_hs_age_sec | int) // 60 }} мин назад (fail >{{ diag_handshake_fail_min }}m, warn >{{ diag_handshake_warn_min }}m)
      {%- endif -%}
  when: "'handshake_age' in diag_check_types"
  tags: handshake_age

- name: "handshake_age :: append result"
  ansible.builtin.set_fact:
    diag_collected_checks: "{{ diag_collected_checks + [diag_hs_entry] }}"
  vars:
    diag_hs_entry:
      name: handshake_age
      status: "{{ diag_hs_status | trim }}"
      latency_ms: null
      message: "{{ diag_hs_message | trim }}"
      details:
        handshake_epoch: "{{ diag_hs_epoch | int }}"
        handshake_age_seconds: "{{ diag_hs_age_sec | int }}"
        threshold_warn_min: "{{ diag_handshake_warn_min | int }}"
        threshold_fail_min: "{{ diag_handshake_fail_min | int }}"
  when: "'handshake_age' in diag_check_types"
  tags: handshake_age

# ── ping_endpoint (ICMP до gateway exit'а через WG) ─────────────────────
- name: "ping_endpoint :: send 3 ICMP packets через WG iface"
  ansible.builtin.command:
    argv:
      - ping
      - -c
      - "3"
      - -W
      - "2"
      - -I
      - "{{ diag_wg_iface }}"
      - "{{ diag_exit_wg_addr }}"
  register: diag_ping_endpoint
  changed_when: false
  failed_when: false
  when: "'ping_endpoint' in diag_check_types"
  tags: ping_endpoint

- name: "ping_endpoint :: extract RTT summary"
  ansible.builtin.set_fact:
    diag_ping_rtt: >-
      {{ diag_ping_endpoint.stdout | default('')
         | regex_search('rtt min/avg/max/mdev = [^ ]+') | default('') }}
  when: "'ping_endpoint' in diag_check_types"
  tags: ping_endpoint

- name: "ping_endpoint :: append result"
  ansible.builtin.set_fact:
    diag_collected_checks: "{{ diag_collected_checks + [diag_ping_entry] }}"
  vars:
    diag_ping_entry:
      name: ping_endpoint
      status: "{{ 'ok' if (diag_ping_endpoint.rc == 0) else 'fail' }}"
      latency_ms: null
      message: >-
        {%- if diag_ping_endpoint.rc == 0 -%}
        ping {{ diag_exit_wg_addr }} через {{ diag_wg_iface }}: {{ diag_ping_rtt }}
        {%- else -%}
        ping {{ diag_exit_wg_addr }} fail (rc={{ diag_ping_endpoint.rc }}): {{ (diag_ping_endpoint.stderr | default(''))[:200] }}
        {%- endif -%}
      details:
        rc: "{{ diag_ping_endpoint.rc }}"
        rtt_summary: "{{ diag_ping_rtt }}"
        target: "{{ diag_exit_wg_addr }}"
        iface: "{{ diag_wg_iface }}"
  when: "'ping_endpoint' in diag_check_types"
  tags: ping_endpoint

# ── ping_internet_through (HTTPS через WG до 1.1.1.1) ───────────────────
- name: "ping_internet_through :: curl --interface через WG"
  ansible.builtin.command:
    argv:
      - curl
      - -s
      - -o
      - /dev/null
      - -w
      - "%{http_code}|%{time_total}"
      - --max-time
      - "8"
      - --interface
      - "{{ diag_wg_iface }}"
      - https://1.1.1.1/
  register: diag_curl_internet
  changed_when: false
  failed_when: false
  when: "'ping_internet_through' in diag_check_types"
  tags: ping_internet_through

- name: "ping_internet_through :: parse curl output"
  ansible.builtin.set_fact:
    diag_curl_code: "{{ (diag_curl_internet.stdout | default('|') | split('|'))[0] }}"
    diag_curl_time_s: "{{ (diag_curl_internet.stdout | default('|') | split('|'))[1] | default('0') }}"
  when: "'ping_internet_through' in diag_check_types"
  tags: ping_internet_through

- name: "ping_internet_through :: compute latency ms"
  ansible.builtin.set_fact:
    diag_curl_ms: >-
      {{ ((diag_curl_time_s | float) * 1000) | round(0, 'common') | int
         if (diag_curl_internet.rc == 0 and diag_curl_time_s != '0') else 0 }}
  when: "'ping_internet_through' in diag_check_types"
  tags: ping_internet_through

- name: "ping_internet_through :: append result"
  ansible.builtin.set_fact:
    diag_collected_checks: "{{ diag_collected_checks + [diag_curl_entry] }}"
  vars:
    diag_curl_entry:
      name: ping_internet_through
      status: "{{ 'ok' if (diag_curl_code in ['200', '301']) else 'fail' }}"
      latency_ms: "{{ (diag_curl_ms | int) if (diag_curl_internet.rc == 0) else None }}"
      message: >-
        {%- if diag_curl_internet.rc == 0 -%}
        https://1.1.1.1 через {{ diag_wg_iface }} → HTTP {{ diag_curl_code }} за {{ diag_curl_ms }} мс
        {%- else -%}
        curl --interface {{ diag_wg_iface }} fail (rc={{ diag_curl_internet.rc }}): {{ (diag_curl_internet.stderr | default(''))[:200] }}
        {%- endif -%}
      details:
        rc: "{{ diag_curl_internet.rc }}"
        http_code: "{{ diag_curl_code }}"
        time_seconds: "{{ diag_curl_time_s }}"
        target: https://1.1.1.1/
        iface: "{{ diag_wg_iface }}"
  when: "'ping_internet_through' in diag_check_types"
  tags: ping_internet_through

# ── xray_port (слушает ли Reality) ──────────────────────────────────────
- name: "xray_port :: ss -tlnp + grep"
  ansible.builtin.shell: |
    set -o pipefail
    ss -tlnp 2>/dev/null | grep ":{{ diag_xray_port }}" || true
  args:
    executable: /bin/bash
  register: diag_xray_ss
  changed_when: false
  failed_when: false
  when: "'xray_port' in diag_check_types"
  tags: xray_port

- name: "xray_port :: append result"
  ansible.builtin.set_fact:
    diag_collected_checks: "{{ diag_collected_checks + [diag_xray_entry] }}"
  vars:
    diag_xray_entry:
      name: xray_port
      status: "{{ 'ok' if (diag_xray_ss.stdout | trim | length > 0) else 'fail' }}"
      latency_ms: null
      message: >-
        {%- if (diag_xray_ss.stdout | trim | length > 0) -%}
        xray слушает :{{ diag_xray_port }} → {{ diag_xray_ss.stdout_lines[0] | default('') }}
        {%- else -%}
        никто не слушает :{{ diag_xray_port }} — xray упал или не запущен
        {%- endif -%}
      details:
        port: "{{ diag_xray_port }}"
        ss_output: "{{ diag_xray_ss.stdout_lines | default([]) }}"
  when: "'xray_port' in diag_check_types"
  tags: xray_port

# ── listening_sockets (общий снапшот для контекста) ─────────────────────
- name: "listening_sockets :: ss -tulpn"
  ansible.builtin.shell: "ss -tulpn 2>/dev/null || true"
  args:
    executable: /bin/bash
  register: diag_all_sockets
  changed_when: false
  failed_when: false
  when: "'listening_sockets' in diag_check_types"
  tags: listening_sockets

- name: "listening_sockets :: append result"
  ansible.builtin.set_fact:
    diag_collected_checks: "{{ diag_collected_checks + [diag_sockets_entry] }}"
  vars:
    diag_sockets_entry:
      name: listening_sockets
      status: info
      latency_ms: null
      message: "собрано {{ diag_all_sockets.stdout_lines | default([]) | length }} сокетов"
      details:
        rc: "{{ diag_all_sockets.rc | default(-1) }}"
        lines: "{{ diag_all_sockets.stdout_lines | default([]) }}"
  when: "'listening_sockets' in diag_check_types"
  tags: listening_sockets

# ── Финал: пишем структурированный JSON на контроллер ───────────────────
# Backend orchestrator потом прочитает этот файл и подмержит в
# ProvisioningTask.result рядом со stdout/stderr/rc от ansible.
- name: Write structured diagnose result to controller
  ansible.builtin.copy:
    content: "{{ diag_payload | to_nice_json }}"
    dest: "{{ diag_result_file }}"
    mode: "0644"
  vars:
    diag_payload:
      started_at: "{{ diag_started_at }}"
      finished_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      relay_iface: "{{ diag_wg_iface }}"
      exit_pubkey_prefix: "{{ diag_exit_pubkey[:12] }}"
      requested_checks: "{{ diag_check_types }}"
      checks: "{{ diag_collected_checks }}"
  delegate_to: localhost
  become: false
