---
# Defaults for diagnose_relay_link role.
#
# The backend orchestrator overrides these via extra_vars based on the
# RelayExitLink row + payload.check_types from the API request. Defaults
# here exist so the role can be run manually for debugging:
#
#   ansible-playbook -i inventories/prod/hosts.yml \
#     playbooks/diagnose_relay_link.yml -e relay_node=ru-pq-01 \
#     -e diag_wg_iface=wg1 -e diag_exit_pubkey=... -e diag_exit_wg_addr=10.77.0.1

# Which checks to run. Names map 1:1 to per-task blocks below.
# Available: peer_on_jump, handshake_age, ping_endpoint,
#            ping_internet_through, xray_port, listening_sockets
diag_check_types:
  - peer_on_jump
  - handshake_age
  - ping_endpoint
  - ping_internet_through
  - xray_port
  - listening_sockets

# Handshake-age thresholds in minutes. Match the smart-trigger thresholds
# in worker run_relay_link_health_tick so manual and auto diagnostics
# call the same link "stale" or "healthy".
diag_handshake_warn_min: 5
diag_handshake_fail_min: 15

# Path on the CONTROLLER (backend container) where the structured result
# JSON is written. Orchestrator picks it up after the play finishes and
# merges into ProvisioningTask.result. Default is overwritten with
# `/tmp/diagnose-result-<task_id>.json` by the orchestrator so concurrent
# diagnose tasks don't trample each other.
diag_result_file: "/tmp/diagnose-result.json"

# Required (no defaults — orchestrator MUST pass):
#   diag_wg_iface           — "wg0" / "wg1" — RelayExitLink.wg_interface_name
#   diag_exit_pubkey        — WGExitNode.wg_public_key
#   diag_exit_wg_addr       — exit's inner WG address (gateway from relay's POV)
#   diag_client_wg_addr     — RelayExitLink.wg_client_address_v4 (without /32)
#   diag_xray_port          — usually 9443 (Reality) — from VPNConfig.port
