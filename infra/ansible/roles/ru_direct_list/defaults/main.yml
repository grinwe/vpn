---
# Единый источник правды для RU split-tunnel: что ходит НАПРЯМУЮ с самой ноды,
# минуя WG-туннель к зарубежному exit'у.
#
# Роль не выполняет задач — она только носитель переменных. Подключается через
# `include_role: name: ru_direct_list` в install_vless_reality,
# install_vless_xhttp, install_vless_ws_cdn и install_hysteria2; каждый шаблон
# рендерит эти списки в СВОЙ синтаксис (xray: regexp:/domain:, hysteria2:
# suffix:). Так правка списка физически не может приземлиться в один протокол
# и разъехаться с остальными — ровно это в проекте и происходило: reality
# получил RU-обход 21.04.2026, xhttp только 05.06, ws-cdn и hy2 — 28.07.
#
# Паритет проверяется backend/tests/test_split_routing_parity.py.

# Зоны верхнего уровня. Рендерятся как суффиксный матч всей зоны.
# xn--p1ai = .рф, xn--d1acj3b = .дети, xn--p1acf = .рус.
ru_direct_zones:
  - ru
  - su
  - xn--p1ai
  - moscow
  - tatar
  - xn--d1acj3b
  - xn--p1acf

# Конкретные домены (матч включает поддомены). ТОЛЬКО не-.ru зоны: всё в .ru
# уже покрыто списком выше и дублировать не нужно.
#
# Раньше здесь стоял regexp `^(yandex|mail|vk|ok|...)\..+$`, анкоренный на
# ПЕРВЫЙ лейбл, а не на регистрируемый суффикс. Он ловил mail.google.com,
# mail.proton.me, mail.yahoo.com, ok.google.com, hh.com — они уходили напрямую
# с РУ-IP; для proton это была жёсткая поломка (в РФ заблокирован → домен
# просто не открывался у юзера с включённым VPN). И одновременно НЕ ловил
# www.vk.com / m.vk.com, потому что первым лейблом там www/m.
ru_direct_domains:
  # VK / Mail.ru — на CDN приходится основной объём байт (фото, видео),
  # при том что «морда» vk.com шла напрямую и без них.
  - vk.com
  - vk.me
  - vk.cc
  - userapi.com
  - mycdn.me
  # Яндекс вне .ru
  - yandex.com
  - yandex.net
  - yastatic.net
  # Прочие РУ-сервисы в не-.ru зонах
  - habr.com
  - 2gis.com
  - avito.st
  # Гео-лицензированный стриминг: с зарубежного IP отдаёт заглушку
  - okko.tv
  - premier.one
  - more.tv
  - my.games
  - zvuk.com
  # Хвост не-.ru зон РУ-брендов. Раньше их ловил бренд-regexp «любой TLD»
  # (вместе с mail.google.com и прочими ложными), теперь — поимённо.
  - ozon.travel
  - rutube.com
  - lenta.com
  - tass.com
  - sberbank.com
  - tinkoff.com
  - tbank.ru
  - yandex.com.tr
  - wildberries.by
  - wildberries.kz
  - wildberries.am
