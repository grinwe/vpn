---
# Disaster-recovery: вытащить /etc/wireguard/wg*.conf со всех нод —
# и jump (vpn_nodes с relay_config), и exit (wg_exit_nodes). Read-only,
# никакой мутации.
#
# WG-конфиг — это plaintext с приватным ключом, server-side настройками
# и peer'ами (с public_key, endpoint, AllowedIPs). Этого хватает,
# чтобы пересобрать wg_exit_nodes + relay_exit_links в БД ровно с теми
# же ключами, что сейчас крутятся на машинах. Туннели не пересоздаются,
# юзеры не теряют связь.

- name: Wait for SSH (retry transient timeouts)
  ansible.builtin.wait_for_connection:
    delay: 0
    timeout: 60
    sleep: 5
  ignore_errors: yes
  ignore_unreachable: yes

- name: Probe /etc/wireguard for wg*.conf on {{ inventory_hostname }}
  ansible.builtin.find:
    paths: /etc/wireguard
    patterns: "wg*.conf"
    file_type: file
  register: _wg_files
  changed_when: false
  failed_when: false
  retries: 3
  delay: 10
  until: _wg_files is succeeded
  ignore_unreachable: yes

- name: Skip if /etc/wireguard absent or empty
  ansible.builtin.debug:
    msg: "No wg*.conf on {{ inventory_hostname }} — skipping."
  when: _wg_files.files | default([]) | length == 0

- name: Slurp every wg*.conf
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ _wg_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: _wg_slurps
  when: _wg_files.files | default([]) | length > 0
  retries: 3
  delay: 10
  until: _wg_slurps is succeeded
  ignore_unreachable: yes

- name: Ensure output dir on controller
  ansible.builtin.file:
    path: "{{ recover_wg_inventory_output_dir }}"
    state: directory
    mode: "0700"  # cleartext private keys — read-only owner.
  delegate_to: localhost
  become: false
  run_once: true

- name: Write per-host wg config copies to controller
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: >-
      {{ recover_wg_inventory_output_dir }}/{{ inventory_hostname }}__{{
        item.source | basename
      }}
    mode: "0600"
  loop: "{{ _wg_slurps.results | default([]) }}"
  loop_control:
    label: "{{ item.source | default('?') }}"
  delegate_to: localhost
  become: false
  when:
    - _wg_slurps is defined
    - item.content is defined
