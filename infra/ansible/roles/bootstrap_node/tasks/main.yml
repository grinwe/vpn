---
- name: Ensure VPN system group
  group:
    name: "{{ vpn_system_group }}"
    state: present

- name: Ensure VPN system user
  user:
    name: "{{ vpn_system_user }}"
    group: "{{ vpn_system_group }}"
    shell: /usr/sbin/nologin
    create_home: no
    state: present

- name: Ensure SSH keys installed
  authorized_key:
    user: root
    key: "{{ item }}"
    state: present
  loop: "{{ ssh_public_keys | default([]) }}"

- name: Mask apt-daily timers (no auto-updates during bootstrap)
  # Ubuntu по умолчанию ставит apt-daily.timer + apt-daily-upgrade.timer
  # с OnBootSec=15min — после reboot'а они через 15 минут стартанут
  # apt-get update / unattended-upgrade, конкурируя с нашим bootstrap'ом
  # за apt/lists/lock. На свежей ноде это особенно злобно: первый
  # bootstrap начинается одновременно с первым auto-update'ом, оба
  # дерутся за lock, wait-task'ы попадают в бесконечный sleep-loop.
  #
  # Мы сам manage apt через ansible, авто-апдейты только мешают.
  # mask блокирует FUTURE старты timer'а/сервиса (даже manual systemctl
  # start не сработает). НЕ ставим state: stopped — apt-операция в
  # полёте сама закончится корректно, нам важно только запретить
  # СЛЕДУЮЩИЙ запуск. Текущий полёт дренируем через fuser wait ниже.
  systemd:
    name: "{{ item }}"
    enabled: no
    masked: yes
  loop:
    - apt-daily.timer
    - apt-daily.service
    - apt-daily-upgrade.timer
    - apt-daily-upgrade.service
  failed_when: false

- name: Install base packages
  # lock_timeout=600 — apt-модуль СAM ждёт apt/dpkg lock через
  # DPkg::Lock::Timeout, без shell-loop с fuser. Прошлая версия делала
  # `while fuser ... sleep 5`; при ansible-таймауте sh-процесс
  # orphan'ился под systemd (PID 1) и продолжал крутиться вечно — на
  # ноде накапливались "сироты" с каждого неудачного bootstrap'а, и при
  # дальнейших диагностиках они мимикрировали под "lock держится".
  # См. POSTMORTEM § wait-storm.
  apt:
    name:
      - ufw
      - curl
      - htop
      - jq
      - fail2ban
      - unattended-upgrades
    state: present
    update_cache: yes
    lock_timeout: 600

# ── Открыть 22/80/443 на iptables-уровне ────────────────────────────
# У части RU-VPS-провайдеров cloud-init из коробки ставит restrictive
# INPUT policy / нативные iptables-правила (мы видели это на
# ru-cloud-web-02: nginx слушает локально, но certbot HTTP-01
# challenge таймаутит — LE не может достучаться до :80 извне).
#
# Идемпотентно: ansible iptables module матчит правило по точному
# совпадению параметров. Если ACCEPT уже стоит — не дублирует.
# `action: insert` ставит правило в начало INPUT chain — даже если
# где-то ниже есть -j DROP, наш ACCEPT срабатывает первым.
#
# `failed_when: false` — на минимальных образах (alpine-like) iptables
# может быть не установлен или kernel module отсутствовать. Не валим
# play, шаг становится best-effort.
- name: Ensure iptables ACCEPT for SSH/HTTP/HTTPS at top of INPUT
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    action: insert
    state: present
  loop: ["22", "80", "443"]
  failed_when: false

# Параллельно — ufw allow. На inactive ufw (наш текущий дефолт, см.
# закомменченный блок ниже) команда без эффекта; но если когда-нибудь
# ufw enable'нётся (вручную или из group_vars), эти правила уже стоят
# и ssh/http/https не отваливается.
- name: Ensure ufw allows SSH/HTTP/HTTPS (idempotent, no-op on inactive ufw)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443"]
  failed_when: false

# ВРЕМЕННО ЗАКОММЕНТИРОВАНО — ufw rate-limit на 22/tcp блокировал сам
# ansible-раннер (6+ коннектов/30с с одного egress-IP → drop), из-за
# чего бутстрап падал на UNREACHABLE после этого шага. Вернуть после
# того, как в group_vars/vpn_nodes.yml появится whitelist management-IP
# и в роль будет добавлен `ufw allow from {{ item }} to any port 22`
# ДО limit-правила.
# - name: Configure UFW default policy
#   ufw:
#     state: enabled
#     policy: deny
#   notify: reload ufw
#
# # ufw limit на 22/tcp: 6+ соединений с одного src IP за 30с → block.
# # Это firewall-уровневый троттлинг брутфорса; работает ДО sshd вообще,
# # так что при ддос-атаке не забивается sshd-лог и fail2ban успевает
# # спокойно разбирать то, что прошло через rate-limit. ssh ходит на
# # стандартный порт 22 (см. MOTD, inventories — кастомного порта нет).
# - name: Rate-limit SSH at firewall level
#   ufw:
#     rule: limit
#     port: "22"
#     proto: tcp
#
# - name: Allow firewall ports
#   ufw:
#     rule: allow
#     port: "{{ item }}"
#     proto: tcp
#   loop: "{{ firewall_allowed_ports | default([]) }}"

- name: Disable password authentication in sshd
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart ssh

- name: Restrict root login with password
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
    state: present
  notify: restart ssh

# Доп. sshd-ужесточение. Ни одна из строк не должна ломать
# Ansible-прогон: мы всегда заходим root'ом по ключу, MaxAuthTries=5
# оставляет запас на ssh-agent с несколькими ключами (3 — рискованно,
# если у оператора в агенте залито 4-5 ключей, sshd рвёт соединение
# раньше, чем доходит до нужного). X11/TcpForwarding на VPN-ноде не
# нужны: SSH туда ходит только для Ansible, пользовательский трафик —
# через xray/shadowtls, у них свои порты.
- name: Harden sshd (MaxAuthTries)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: 'MaxAuthTries 5'
    state: present
  notify: restart ssh

- name: Harden sshd (LoginGraceTime)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?LoginGraceTime'
    line: 'LoginGraceTime 30'
    state: present
  notify: restart ssh

- name: Harden sshd (PermitEmptyPasswords)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords'
    line: 'PermitEmptyPasswords no'
    state: present
  notify: restart ssh

- name: Harden sshd (X11Forwarding)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?X11Forwarding'
    line: 'X11Forwarding no'
    state: present
  notify: restart ssh

# fail2ban sshd jail. Это L7-бан после rate-limit: если кто-то прошёл
# ufw limit (≤5 соединений/30с), но внутри них валит битые логины —
# ловим тут по паттернам sshd-лога. maxretry=5 / findtime=10m / ban=1h
# — умеренно агрессивно для управляемой ноды (нет shell-юзеров, все
# логины должны быть только автоматизированные Ansible-запуски).
- name: Configure fail2ban sshd jail
  copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      maxretry = 5
      findtime = 600
      bantime = 3600
      backend = systemd
  notify: restart fail2ban

- name: Ensure fail2ban is enabled and running
  service:
    name: fail2ban
    state: started
    enabled: yes

# unattended-upgrades — security-only по умолчанию. Конфиг ставит
# систему на автоматическое применение security-патчей, оставляя
# feature-апдейты ручными. `Unattended-Upgrade::Automatic-Reboot`
# отключён: VPN-нода с клиентским трафиком не должна ребутаться сама
# посреди ночи без наблюдения — накопившиеся ядерные CVE приоритетнее
# uptime только на отдельных нодах, и это осознанный ручной выбор.
- name: Enable unattended-upgrades (security-only, no auto-reboot)
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Set MOTD banner
  copy:
    dest: /etc/motd
    mode: "0644"
    content: |
      Managed VPN node. Unauthorized access prohibited.
      SSH key auth only. Contact NOC for access.

# xray log directory must exist BEFORE any protocol role renders a
# config that references /var/log/xray/access-*.log. We put it here
# (not inside install_vless_*) because protocol roles are gated on
# extra_vars that may be absent during a manual site.yml run, yet the
# config from a previous backend-driven run already has the access log
# path — xray crashes on restart with "permission denied" if the
# directory is missing or root-owned.
- name: Ensure xray log directory
  file:
    path: /var/log/xray
    state: directory
    owner: nobody
    group: nogroup
    mode: '0750'
    recurse: yes

- name: Install xray access log rotation
  copy:
    content: |
      /var/log/xray/access-*.log {
          daily
          rotate 3
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
      }
    dest: /etc/logrotate.d/xray
    owner: root
    group: root
    mode: '0644'
