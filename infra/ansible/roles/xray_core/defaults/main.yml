---
# Pin xray-core version. Bump'аем отдельным коммитом этой роли вместе
# с release-notes upstream'а, потом прокатываем resync. Pin защищает
# от внезапного breaking change (xray иногда меняет CLI/conf-format).
xray_core_version: "v26.3.27"
# sha256 официального Xray-linux-64.zip для пина выше (из upstream .dgst,
# SHA2-256). Проверяется на ноде ДО распаковки/install: бинарь качается через
# сторонний реверс-прокси ghproxy.com и ставится под root на весь флот, а
# единственной валидацией был размер архива (аудит 2026-07-25). Качать .dgst
# по той же цепочке смысла нет — хеш обязан приезжать через ansible.
# ОБНОВЛЯТЬ ВМЕСТЕ С xray_core_version:
#   curl -sSL https://github.com/XTLS/Xray-core/releases/download/<ver>/Xray-linux-64.zip.dgst
# Пусто = проверка пропускается (только для отладки; в логе будет warning).
xray_core_sha256: "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
