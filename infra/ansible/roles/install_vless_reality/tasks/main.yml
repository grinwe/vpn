---
# install_vless_reality
#
# Authoritative installer for xray-core serving VLESS+Reality. Unlike the
# old stub, this role:
#
#   * actually installs xray from upstream (was previously a noop that
#     assumed xray was somehow already there);
#   * renders a real config.json from a template, with reality keys
#     supplied by the backend as extra_vars (see services/vless.py). No
#     state generation on the node itself;
#   * enables xray's gRPC stats API bound to loopback, so the traffic
#     collector can read per-user counters by email;
#   * preserves any clients previously added by manage_vless_user.sh
#     across re-runs (slurp + re-inject), so a routine site.yml run
#     no longer wipes every VLESS user on the node. On first bootstrap
#     the list is empty and the backend fills it via provision_device.
#
# The role is a no-op unless the caller provides ``vless_reality_*``
# vars. In the main site.yml we gate it on those being set, so nodes
# that do not serve Reality (pure ShadowTLS) stay untouched.
- name: Stop xray when VLESS Reality is removed
  systemd:
    name: xray
    state: stopped
    enabled: no
  when: vless_reality_private_key is not defined or vless_reality_private_key | length == 0
  failed_when: false

- name: Skip role when VLESS Reality is not configured
  meta: end_role
  when: vless_reality_private_key is not defined or vless_reality_private_key | length == 0

- name: Require Reality config variables
  assert:
    that:
      - vless_reality_private_key is defined and vless_reality_private_key | length > 0
      - vless_reality_public_key is defined and vless_reality_public_key | length > 0
      - vless_reality_short_id is defined and vless_reality_short_id | length > 0
      - vless_reality_port is defined
      - vless_reality_sni is defined and vless_reality_sni | length > 0
      - vless_reality_dest is defined and vless_reality_dest | length > 0
    fail_msg: >-
      install_vless_reality requires backend-supplied Reality parameters
      (vless_reality_private_key, public_key, short_id, port, sni, dest).
      The backend generates these in services/vless.py and passes them
      as extra_vars when running site.yml for a node.

- name: Ensure dependencies
  apt:
    name:
      - curl
      - unzip
      - jq
      - ca-certificates
    state: present
    update_cache: yes

# 443-унификация PREFLIGHT — модуль nginx-stream ОБЯЗАН стоять ДО того, как reality
# уедет на loopback и в nginx.conf вставится stream{}. Инцидент 4vds-ru-01
# (2026-07-23): apt-install модуля падал молча (failed_when:false), блок stream{}
# вставлялся всё равно → nginx 'unknown directive "stream"' → nginx down + reality
# на loopback + dpkg заклинен. Ставим ЗДЕСЬ (до config.json/xray-рестарта), с
# ретраями и ГРОМКО: не встал модуль → падаем ДО правки reality, нода остаётся живой.
- name: 443-unify preflight — install nginx stream module (loud, retried)
  ansible.builtin.apt:
    name: libnginx-mod-stream
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: _reality_stream_mod
  until: _reality_stream_mod is succeeded
  retries: 3
  delay: 5
  when: reality_stream_unify | default(false)

- name: 443-unify preflight — locate stream module load config
  ansible.builtin.find:
    paths: /etc/nginx/modules-enabled
    patterns: "*mod-stream*.conf"
    # file_type: any — libnginx-mod-stream кладёт 50-mod-stream.conf СИМЛИНКОМ на
    # modules-available; find по дефолту матчит только обычные файлы → пропустил бы
    # симлинк и ложно свалил assert ниже (модуль есть, а preflight «не нашёл»).
    file_type: any
  register: _reality_stream_mod_files
  when: reality_stream_unify | default(false)

- name: 443-unify preflight — fail early if stream module not enabled
  ansible.builtin.assert:
    that: _reality_stream_mod_files.matched | int > 0
    fail_msg: >-
      libnginx-mod-stream не подключён в /etc/nginx/modules-enabled — вставлять
      stream{} в nginx.conf нельзя (nginx упадёт с 'unknown directive stream').
      Проверь apt/репозиторий на ноде и повтори бутстрап. Reality не тронут.
  when: reality_stream_unify | default(false)

# geoip.dat нужен до первого рендера config.json: routing rule
# `ip: ["geoip:ru", "geoip:private"]` без файла данных не резолвится,
# xray падает со "failed to load geoip" на старте. Установка + weekly
# refresh инкапсулированы в роль xray_geoip (общая для Reality и XHTTP,
# она же тащит CDN-fallback wrapper jsdelivr→ghproxy→github потому что
# прямой github троттлится у части RU-провайдеров).
- name: Provision geoip.dat fetcher + weekly refresh timer
  include_role:
    name: xray_geoip

# xray-core install: pinned version через ghproxy с fallback'ом на
# github. Раньше тут был inline-вызов upstream's install-release.sh,
# но он 5-минутно SSL-timeout'ил с RU-провайдеров (см. xray_core
# role rationale + ru-cloud-web-02 ticket).
- name: Install xray-core (CDN-fallback)
  include_role:
    name: xray_core

# Preserve clients added dynamically by manage_vless_user.sh across
# re-runs of this role. The template ships `clients: []` by design
# (the backend is authoritative for user state), but a plain re-render
# during a routine `site.yml` run would wipe every VLESS user on the
# node — existing clients would start getting "invalid request user id"
# until the backend re-provisions them. We avoid that by slurping the
# previous config (if any), pulling the current client list out of the
# vless-reality inbound, and injecting it into the new render.
- name: Check for existing xray config
  stat:
    path: /usr/local/etc/xray/config.json
  register: vless_reality_existing_config

- name: Slurp existing xray config
  slurp:
    src: /usr/local/etc/xray/config.json
  register: vless_reality_existing_config_raw
  when: vless_reality_existing_config.stat.exists

- name: Extract existing vless-reality clients
  set_fact:
    vless_reality_existing_clients: >-
      {{
        (vless_reality_existing_config_raw.content | b64decode | from_json).inbounds
        | selectattr('tag', 'equalto', 'vless-reality')
        | map(attribute='settings.clients')
        | list
        | first
        | default([])
      }}
  when: vless_reality_existing_config.stat.exists
  # If the existing file is unparseable (half-written, truncated) we'd
  # rather fall through to an empty list than abort the whole play —
  # the backend resync path will re-add users after the render anyway.
  ignore_errors: true

- name: Default to empty clients list on first bootstrap
  set_fact:
    vless_reality_existing_clients: []
  when: vless_reality_existing_clients is not defined

# Also in bootstrap_node (the authoritative one). Kept here as a
# safety net in case bootstrap order changes.
- name: Ensure xray log directory
  file:
    path: /var/log/xray
    state: directory
    owner: nobody
    group: nogroup
    mode: '0750'
    recurse: yes

- name: Ensure xray config directory
  file:
    path: /usr/local/etc/xray
    state: directory
    owner: root
    # Same reason as config.json below: xray runs as nobody:nogroup
    # under systemd. Without group-traverse on the parent dir, even a
    # world-readable config.json would be unreachable.
    group: nogroup
    mode: '0750'

- name: Render xray config.json
  template:
    src: config.json.j2
    dest: /usr/local/etc/xray/config.json
    owner: root
    # xtls-installer's xray.service runs `User=nobody`, whose primary
    # group is `nogroup` on Debian/Ubuntu. If we leave group=root with
    # mode 0640 the nobody process can't read config.json and xray
    # exits 23 ("failed to read config") within 70ms. Combined with
    # `RestartPreventExitStatus=23` in the unit, systemd never retries
    # and the node silently has no :443. Root in a foreground run
    # obviously ignores this — which is what masked the bug.
    group: nogroup
    mode: '0640'
    # Back up the previous file so that a bad render leaves a recoverable
    # copy — xray will refuse to start on invalid JSON and a manual revert
    # is otherwise awkward.
    backup: yes
  notify: restart xray

- name: Validate xray config.json before starting
  # Catch bad renders up front so the role fails loudly with the real
  # xray error text instead of a silent systemd 203/EXEC further down.
  # Nodes often ship with volatile journald (journalctl shows "no
  # entries"), so by the time check_node_health runs there is no way
  # left to reconstruct *why* xray refused to start. Running -test here
  # prints the error into the ansible output where we can actually see it.
  command: /usr/local/bin/xray -test -config /usr/local/etc/xray/config.json
  register: xray_config_test
  changed_when: false
  failed_when: xray_config_test.rc != 0

- name: Install VLESS user management helper
  copy:
    src: manage_vless_user.sh
    dest: /usr/local/sbin/manage_vless_user.sh
    owner: root
    group: root
    mode: '0750'

- name: Ensure xray service enabled and running
  systemd:
    name: xray
    enabled: yes
    state: started
    daemon_reload: yes

# Flush handlers now instead of waiting for end-of-play. The upstream
# xray install script starts xray with its own default (empty) config
# BEFORE we render config.json, so by the time check_node_health (a
# later role in the same play) opens a socket, xray is "running" but
# NOT yet bound to the Reality port — our `notify: restart xray` is
# still queued and won't fire until end of play. Flushing here makes
# the restart happen immediately so health checks see the real
# listener.
- name: Flush xray handlers before leaving the role
  meta: flush_handlers

# Safety net: if xray entered 'failed' state on a previous run (e.g.
# permission denied on /var/log/xray before bootstrap_node fixed it)
# and this run's config template didn't change (so the handler didn't
# fire), the unit will sit in 'failed' forever — `state: started`
# above won't recover a unit that hit StartLimitBurst, and the handler
# is a no-op when the template is unchanged. Detect and force-restart.
- name: Check if xray is actually running
  command: systemctl is-active xray
  register: _xray_reality_active
  changed_when: false
  failed_when: false

- name: Reset xray failed state
  command: systemctl reset-failed xray
  when: _xray_reality_active.stdout != 'active'
  changed_when: false
  failed_when: false

- name: Force-start xray after clearing failed state
  systemd:
    name: xray
    state: restarted
    daemon_reload: yes
  when: _xray_reality_active.stdout != 'active'

# ── 443-унификация (nginx stream ssl_preread) — gated on reality_stream_unify ──
# Reality слушает loopback (config.json listen=127.0.0.1), nginx stream на :443
# роутит по SNI: reality-dest → reality loopback, else → nginx-http loopback:8443
# (xhttp/ws-cdn vhost'ы уходят на 8443 в своих ролях). Убирает DPI-tell 9443.
# NB: модуль nginx-stream уже поставлен+проверен в PREFLIGHT выше (до config.json),
# поэтому здесь сразу рендерим stream-роутер — блок ниже не вставится с невалидным
# nginx.conf, т.к. без модуля play упал бы на preflight-ассерте.
- name: Ensure /etc/nginx/stream.d dir (443-unify)
  ansible.builtin.file:
    path: /etc/nginx/stream.d
    state: directory
    mode: '0755'
  when: reality_stream_unify | default(false)

- name: Render nginx stream ssl_preread router (443-unify)
  ansible.builtin.template:
    src: stream-unify.conf.j2
    dest: /etc/nginx/stream.d/reality-unify.conf
    mode: '0644'
  when: reality_stream_unify | default(false)

- name: Ensure top-level stream{} block in nginx.conf (443-unify)
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} V8-443-UNIFY-STREAM"
    block: |
      stream {
          include /etc/nginx/stream.d/*.conf;
      }
    insertafter: EOF
  when: reality_stream_unify | default(false)

# Откат: без унификации убираем stream-роутер + блок, иначе stream :443 конфликтует
# с обычным nginx :443 после возврата vhost'ов на 443.
- name: Remove 443-unify stream router when disabled
  ansible.builtin.file:
    path: /etc/nginx/stream.d/reality-unify.conf
    state: absent
  when: not (reality_stream_unify | default(false))

# Гейт по наличию nginx.conf ОБЯЗАТЕЛЕН: blockinfile проверяет существование
# файла ДО разбора state и валится rc=257 «Path ... does not exist !» даже при
# state=absent. На свежей ноде nginx ещё не установлен (его тянут роли
# install_vless_xhttp/ws_cdn, которые идут ПОСЛЕ этой), а unify там выключен
# (reality_stream_unify = bool(settings.public_port)) — т.е. до фикса эта
# откатная таска валила бутстрап КАЖДОЙ новой ноды (аудит 2026-07-25).
# create: true тут нельзя: модуль создал бы пустой /etc/nginx/nginx.conf и
# сломал последующую установку nginx.
- name: Check nginx.conf presence before 443-unify rollback
  ansible.builtin.stat:
    path: /etc/nginx/nginx.conf
  register: _reality_nginx_conf
  when: not (reality_stream_unify | default(false))

- name: Remove top-level stream{} block when 443-unify disabled
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} V8-443-UNIFY-STREAM"
    state: absent
  when:
    - not (reality_stream_unify | default(false))
    - _reality_nginx_conf.stat.exists | default(false)

# Guarded reload: на ПЕРВОМ unify-bootstrap'е xhttp/ws ещё на :443 → stream :443
# конфликтует → nginx -t падает → НЕ релоадим (xhttp-роль ниже подвинет на 8443 и
# релоаднёт консистентно). На последующих — reality-роль релоадит сама. Сходится.
- name: Reload nginx after stream changes (guarded)
  ansible.builtin.shell: nginx -t && systemctl reload nginx
  register: _unify_reload
  changed_when: false
  failed_when: false
