apiVersion: 1

providers:
  - name: vpn
    orgId: 1
    folder: VPN
    type: file
    disableDeletion: true
    editable: true
    updateIntervalSeconds: 30
    options:
      # Matches the bind-mount in docker-compose.yml — grafana watches
      # this directory and picks up JSON changes without a restart.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
