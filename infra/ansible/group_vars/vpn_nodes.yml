ansible_user: root
vpn_system_user: vpnsvc
vpn_system_group: vpnsvc
firewall_allowed_ports:
  - 22
  - 443
  - 8443
  - 9443
# Публичные ключи, которые роль bootstrap_node прописывает в
# /root/.ssh/authorized_keys на каждой VPN-ноде. Обязательно должен
# быть ключ бэкенда (provisioning@grinwer) — иначе после ротации
# authorized_keys вручную или пере-заливки ноды мы потеряем доступ
# и ansible-прогон обратно её поднять не сможет.
ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE8IrzyHuBdSXDnBCE9XthETlDDrD4nsOqeubIt6oMkS provisioning@grinwer"
domain_mask: "www.cloudflare.com"
vless_enabled: true
