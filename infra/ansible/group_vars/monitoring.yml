---
# Non-secret monitoring group vars. Secrets (admin password) live in
# the sibling ``monitoring/vault.yml`` encrypted with ansible-vault.

# Where the backend's /metrics lives as seen from *inside* prometheus
# container. Default ``backend:8000`` работает потому что prometheus
# джойнится к внешней сети app-stack'а (``vpn_default``) и резолвит
# backend по container-DNS. Линукс-специфика: ``host.docker.internal``
# на Linux резолвится в bridge-gateway IP, а backend биндится на
# host-loopback — разные интерфейсы, connection refused. Перешли на
# joined-network подход. Если когда-нибудь backend/monitoring уедут
# на разные хосты — поменять на ``<ip>:<port>`` + удалить backend_net
# из compose + открыть firewall.
monitoring_stack_backend_metrics_url: "backend:8000"

# Override default bind if you want LAN access from a specific bastion.
# Leave on 127.0.0.1 for SSH-tunnel-only access (recommended).
# monitoring_stack_grafana_bind: "127.0.0.1:3000"
# monitoring_stack_prometheus_bind: "127.0.0.1:9090"

# Fleet-wide: the public IP of this monitoring host. Each vpn_node's
# install_node_exporter role uses this to build an iptables allowlist
# for :9100. Keep in sync with the ansible_host above.
node_exporter_allowed_ips:
  - "45.14.244.140"
