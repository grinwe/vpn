---
# Public web frontend config. The email is used by Let's Encrypt — put
# a real mailbox you actually read, expiry notices go there.
deploy_web_frontend_domain: "grinwer.online"
deploy_web_frontend_letsencrypt_email: "adept38@gmail.com"

# Cloudflare API token for DNS-01 ACME challenge. Needs
# Zone → DNS → Edit on the grinwer.online zone. Stored in the vault.
deploy_web_frontend_cloudflare_api_token: "{{ vault_cloudflare_api_token | default('') }}"

# App stack lives on the same host for now. Override any of the
# deploy_app_stack_* defaults here; secrets come from vault.yml next
# to this file.
deploy_app_stack_dir: "/opt/vpn"
deploy_app_stack_payment_provider: "cryptobot"

# Public base URL for /<token> sub-links baked into Device.connection_uri.
# Point at a CF-fronted proxy so an RKN block on grinwer.online doesn't
# kill installed clients. Worker forwards /<token> to
# <grinwer.online>/api/sub/<token>.
deploy_app_stack_sub_link_base_url: "{{ vault_sub_link_base_url | default('') }}"
# Резервный фронт саб-ссылки (если основной ляжет). Пусто = фолбэка нет.
deploy_app_stack_sub_link_fallback_base_url: "{{ vault_sub_link_fallback_base_url | default('') }}"

# --- Always-on тики: kill-switch'и держим здесь, а не только в коде -------
# Аудит 2026-07-25: эти ручки существовали лишь как os.getenv-дефолты внутри
# worker.py — в проде выключить взбесившийся тик было нечем, кроме правки
# кода и деплоя. Значения ниже = те же дефолты, менять по месту.
deploy_app_stack_cert_renewal_interval: 86400   # 0 — выключить тик
deploy_app_stack_cert_renewal_days: 21          # порог near-expiry, держать < 30
deploy_app_stack_cert_renewal_max_per_tick: 6
deploy_app_stack_reality_dest_health_interval: 86400  # 0 — выключить тик
deploy_app_stack_reality_dest_fail_threshold: 2
# ВЫКЛ осознанно: воркер пробит dest из NL, а geo-чувствительные dest'ы
# (гос-сайты) из-за границы отдают иначе → ротация по false-positive.
deploy_app_stack_reality_dest_auto_rotate: 0
deploy_app_stack_reality_dest_max_rotate_per_tick: 3
deploy_app_stack_pending_rescue_force_age: 1800
deploy_app_stack_pending_rescue_abandon_age: 86400
deploy_app_stack_restore_hy2_after_reinstall: 1

# #53 — TTL for the Telegram initData handshake at /api/webapp/auth.
# 300s is Telegram's recommended validation window; keep short to
# bound the replay window. NOT a secret — just a tunable.
deploy_app_stack_webapp_init_data_ttl_seconds: 300

# Provisioning reconciler — ВКЛючён в проде: правки нод сходятся через
# desired-state reconcile-тик (debounce + coalesce) вместо немедленного
# bootstrap'а на каждое действие. Миграция 0043 бэкфилит desired=reconciled=0,
# поэтому включение НЕ триггерит mass-rebuild — реконсайлятся только ноды,
# правленные после включения. Откат: "0" + redeploy (или RECONCILER_ENABLED=
# на хосте). Тунаблы interval/debounce/cap/retry — дефолты из defaults/main.yml.
# См. docs/operations/provisioning_reconciler_epic.md.
deploy_app_stack_reconciler_enabled: "1"  # ВКЛ 2026-06-15: ручные bootstrap-эндпоинты (create_node/with_configs/rebootstrap/refresh-reality + spawn-finalize) теперь зовут defer_to_reconciler=False → немедленная таска, не дебаунсятся. Config-edit-сайты по-прежнему коалесятся реконсайлером. Откат: "0" + redeploy (или тег pre-reconciler-enable-*).

# Controller-side path to the SSH private key used for provisioning
# VPN nodes. Leave empty during initial bootstrap; set it once you
# have the key on disk and re-run the playbook.
deploy_app_stack_provisioning_key_src: "/opt/vpn/secrets/provisioning_key"

# --- Secrets are pulled from vault.yml (same directory) ---
# See group_vars/web/vault.yml.example for the required shape. The
# role refuses to run if any of these are missing or too short.
deploy_app_stack_postgres_password: "{{ vault_postgres_password | default('') }}"
deploy_app_stack_admin_api_token: "{{ vault_admin_api_token | default('') }}"
deploy_app_stack_app_secret_key: "{{ vault_app_secret_key | default('') }}"
deploy_app_stack_bot_token: "{{ vault_bot_token | default('') }}"
deploy_app_stack_bot_username: "{{ vault_bot_username | default('') }}"
deploy_app_stack_admin_ids: "{{ vault_admin_ids | default('') }}"
deploy_app_stack_telegram_stars_webhook_secret: "{{ vault_telegram_stars_webhook_secret | default('') }}"
deploy_app_stack_webapp_jwt_secret: "{{ vault_webapp_jwt_secret | default('') }}"

# Stage 9b — карты РФ/СБП: lava.top + Tribute (docs/PLAN_LAVA_TOP.md).
# Секреты в vault.yml; email_domain и меню способов оплаты — открытые.
# Меню в боте включается заполнением choices (например
# "telegram_stars,lava_top,tribute,cryptobot"); пусто = старое поведение.
# 2026-07-22: запуск со Stars + карта РФ (lava.top). Tribute добавится
# сюда, когда будет создан магазин (сейчас shop-not-found).
deploy_app_stack_payment_provider_choices: "telegram_stars,lava_top"
deploy_app_stack_lava_top_api_key: "{{ vault_lava_top_api_key | default('') }}"
deploy_app_stack_lava_top_offer_id: "{{ vault_lava_top_offer_id | default('') }}"
deploy_app_stack_lava_top_webhook_secret: "{{ vault_lava_top_webhook_secret | default('') }}"
deploy_app_stack_lava_top_email_domain: "{{ deploy_web_frontend_domain }}"
deploy_app_stack_tribute_api_key: "{{ vault_tribute_api_key | default('') }}"

# #62 — native Telegram webhook mode (replaces shared-secret forwarding).
# Reuses vault_telegram_stars_webhook_secret for both legacy and native webhook.
deploy_app_stack_telegram_webhook_secret_token: "{{ vault_telegram_stars_webhook_secret | default('') }}"
deploy_app_stack_telegram_webhook_url: "https://{{ deploy_web_frontend_domain }}/tg-webhook"
deploy_app_stack_bot_internal_webhook_url: "http://bot:8081/webhook"
deploy_app_stack_bot_webhook_port: 8081

# Phase A — probe-agent. Token is a *scoped* api-token (probe:read +
# probe:write) minted via POST /api/api-tokens — see env.j2 for the
# curl recipe. Store the returned plaintext as vault_probe_agent_token
# in vault.yml. The other knobs are tunables — defaults are fine for
# ~50 nodes from this single vantage point.
deploy_app_stack_probe_agent_token: "{{ vault_probe_agent_token | default('') }}"
deploy_app_stack_probe_agent_region: "eu-nl"

# AI-агент (триаж + ops-планировщик). Ключ Claude лежит в vault как
# vault_anthropic_api_key; без этой проводки env.j2 рендерил ANTHROPIC_API_KEY
# пустым и агент молча отдавал 503. Флаг включает агента (read-only триаж +
# dry-run планировщик; мутаций нет).
deploy_app_stack_anthropic_api_key: "{{ vault_anthropic_api_key | default('') }}"
deploy_app_stack_agent_enabled: 1
deploy_app_stack_agent_model: "claude-sonnet-4-6"

# Diverse N×M подписка (Phase A). 1 = однонодовое (инертно), 3 = флоу «3 ноды».
# ВКЛючено 2026-06-12 после проверки HAPP Auto-фейловера. Новые subs получают до
# N диверсных нод (best-effort: сколько тёплых бандлов на разных регионах);
# existing subs не трогаются (их миграция — backfill, Фаза A.2, ещё нет).
# Откат: вернуть 1 + прокат (или тег pre-diverse-sub-e84426a).
deploy_app_stack_diverse_sub_nodes: 3
# Набор эндпоинтов: legacy (как было) → 4x1 включается ЗДЕСЬ отдельным прогоном,
# уже после того как код с миграцией 0065 уехал и подписка проверена.
# docs/operations/subset_epic_2026_07_29.md
deploy_app_stack_sub_leg_scheme: 4x1

# Phase B — HAPP auto-select (subscription-autoconnect + lowestdelay) в заголовках
# сабы. По умолчанию "off" (прод-поведение не меняется). Обкатка: выставить user_id
# тест-юзера (CSV), проверить в HAPP, затем "all". Эффект — на рефреше сабы (≤6ч),
# переимпорт не нужен. См. docs/operations/diverse_subscription_epic.md Фаза B.
# РАСКАТАНО на всех 2026-06-13 после обкатки на user_id=1 (подтверждено: с включённым
# в HAPP «Пинг при запуске» autoconnect садится на лучший пинг на старте). SINCE снят
# → охватывает все девайсы. Откат: вернуть "off".
deploy_app_stack_sub_happ_autoconnect: "all"
# ISO-метка «только новые девайсы» (created_at >= метки). Пусто = без фильтра по дате.
deploy_app_stack_sub_happ_autoconnect_since: ""
# Provider ID из кабинета happ-proxy.com (привязан к домену саб-ссылки, т.е.
# grn-ssync.pro). Без него Happ игнорирует весь Advanced-слой: sub-info-блок,
# sub-expire-баннер, пуши об истечении. Autoconnect выше — НЕ Advanced,
# работает и без providerid (обкатка 2026-06-13).
deploy_app_stack_happ_provider_id: "{{ vault_happ_provider_id | default('') }}"
# announce — Standard-блок статуса Happ (работает без providerid).
# auto = слать, пока providerid не задан; 1 = всегда; 0 = никогда.
# ВРЕМЕННО "1" (2026-07-29): клиент валидирует providerid не чаще раза в
# сутки, и до первой валидации Advanced-слой (sub-info) мёртв — announce
# даёт видимый блок сразу. Когда sub-info подтвердится на устройстве,
# вернуть "auto", иначе у людей будет два блока с одним текстом.
deploy_app_stack_sub_status_announce: "1"
