---
# Disaster-recovery — собрать xray client-листы со всех VPN-нод и
# нормализовать в один users.json для пересборки БД.
#
# Используется после потери контрол-хоста, когда у тебя нет дампа
# Postgres, но физически живы VPN-ноды. В xray-конфиге каждой ноды
# хранится email вида "user-{user_id}-{subscription_id}" (формат из
# backend/app/services/provisioning.py:provision_subscription) — этого
# достаточно, чтобы восстановить структуру User / Subscription /
# Device. plan_id, expires_at, balance, referral_tree — потеряны,
# их докатываем грейс-периодом + ручным разбором payment-provider
# истории.
#
# Usage:
#   cd infra/ansible
#   ansible-playbook -i inventories/prod/hosts.yml \
#       playbooks/recover_xray_inventory.yml
#
# Output:
#   infra/ansible/recovered/<hostname>.config.json   — сырые конфиги
#   infra/ansible/recovered/users.json               — агрегат

- name: Collect xray configs from all VPN nodes
  hosts: vpn_nodes
  become: yes
  gather_facts: no
  ignore_unreachable: yes  # одна мёртвая нода не должна валить весь sweep
  tags: [recovery]
  vars:
    # Перекрываем default из роли — кладём рядом с playbook, а не в /tmp,
    # чтобы выжило перезагрузку контроллера и можно было закоммитить
    # users.json вручную при необходимости.
    recover_xray_inventory_output_dir: "{{ playbook_dir }}/../recovered"
  roles:
    - recover_xray_inventory

- name: Collect WireGuard configs from VPN-nodes (jumps) + exit-nodes
  hosts: vpn_nodes:wg_exit_nodes
  become: yes
  gather_facts: no
  ignore_unreachable: yes
  tags: [recovery, wg]
  vars:
    recover_wg_inventory_output_dir: "{{ playbook_dir }}/../recovered-wg"
  roles:
    - recover_wg_inventory

- name: Aggregate per-node configs into users.json + nodes.json
  hosts: localhost
  gather_facts: no
  tags: [recovery]
  vars:
    # `inventory_file` magic-var на localhost-плеях в новых ansible не
    # выставлен — fallback на путь относительно playbook'а. Override:
    # `ansible-playbook ... -e recovery_inventory_path=/path/to/hosts.yml`.
    recovery_inventory_path: >-
      {{ inventory_file
         | default(playbook_dir + '/../inventories/prod/hosts.yml', true) }}
  tasks:
    - name: Run xray aggregator
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../../scripts/aggregate_xray_inventory.py"
          - "--input-dir"
          - "{{ playbook_dir }}/../recovered"
      register: _aggregate_run
      changed_when: true

    - name: Run wg aggregator
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../../scripts/aggregate_wg_inventory.py"
          - "--input-dir"
          - "{{ playbook_dir }}/../recovered-wg"
          - "--inventory"
          - "{{ recovery_inventory_path }}"
          - "--output"
          - "{{ playbook_dir }}/../recovered/wg.json"
      register: _wg_aggregate_run
      changed_when: true
      failed_when: false  # Если wg-конфигов нет (нерелейная установка) — не падаем.

    - name: Show aggregator summary (xray)
      ansible.builtin.debug:
        msg: "{{ _aggregate_run.stderr_lines }}"

    - name: Show aggregator summary (wg)
      ansible.builtin.debug:
        msg: "{{ _wg_aggregate_run.stderr_lines | default([]) }}"
