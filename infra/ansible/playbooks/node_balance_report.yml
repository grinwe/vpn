---
# Диагностика балансировки нод (read-only): три распределения рядом —
# primary (метрика choose_node), assigned (метрика админ-колонки «Юзеры»),
# carrying (телеметрия) + ghost-девайсы и причины исключения ноды из выбора.
# Ничего не деплоит и не пишет в БД: скрипт скармливается питону backend-
# контейнера через stdin.
#
# Запуск (cwd = infra/ansible):
#   ansible-playbook playbooks/node_balance_report.yml --vault-password-file ~/.vpn_vault_pass
- hosts: web
  gather_facts: false
  tasks:
    - name: Push report script to host tmp
      copy:
        src: "{{ playbook_dir }}/files/node_balance_report.py"
        dest: /tmp/node_balance_report.py
        mode: "0644"

    - name: Run report inside backend container (stdin, read-only)
      shell: docker compose exec -T backend python - < /tmp/node_balance_report.py
      args:
        chdir: /opt/vpn
      register: balance_report
      changed_when: false

    - name: Show report
      debug:
        msg: "{{ balance_report.stdout_lines }}"
