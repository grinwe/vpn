---
# Починка порт-хоппинга Hysteria2: вернуть DNAT-правило и сделать так, чтобы
# оно пережило ребут.
#
# Зачем отдельный плейбук, а не bootstrap. Роль bootstrap_node ставит
# iptables-persistent, а install_hysteria2 — само DNAT-правило, то есть в коде
# всё правильно. Проблема в том, что часть нод не проходила bootstrap после
# того, как пакет попал в список: правило лежит в /etc/iptables/rules.v4, но
# после ребута его некому восстановить, и хоппинг молча мёртв (диагностика —
# docs/operations/runbook.md §14). Полный bootstrap ради одной строки — это
# 300 тасок и риск задеть то, что сейчас работает.
#
# ⚠️ ГЛАВНАЯ ОПАСНОСТЬ, ради которой здесь столько проверок.
# `apt install iptables-persistent` в postinst стартует юнит, а тот делает
# `iptables-restore < /etc/iptables/rules.v4` БЕЗ --noflush (см.
# plugins.d/15-ip4tables; IPTABLES_RESTORE_NOFLUSH в /etc/default закомментирован).
# То есть установка пакета ЗАМЕНЯЕТ живое ядро содержимым файла. Всё, что
# живёт только в ядре и в файл не попало, умирает молча: цепочки fail2ban,
# счётчики трафика, правила, добавленные ролями после последнего save.
# Проверено экспериментально в контейнере с systemd.
#
# Поэтому плейбук СНАЧАЛА сверяет ядро с файлом и отказывается работать, если
# в ядре есть хоть одно правило, которого нет в файле. Разрешать такой
# конфликт автоматически (доложить файл в ядро → снапшот) можно, но это даёт
# дубликаты правил, и делать это вслепую на живых нодах не стоит.
#
# Идемпотентен: повторный прогон ничего не меняет.
#
# Запуск (cwd = infra/ansible):
#   ansible-playbook playbooks/fix_hy2_dnat.yml --vault-password-file ~/.vpn_vault_pass
#
# Только на конкретные ноды:
#   ansible-playbook playbooks/fix_hy2_dnat.yml -l aeza-ru-01,ufo-ru-01 \
#     --vault-password-file ~/.vpn_vault_pass
- name: Restore Hysteria2 port-hopping DNAT and make it survive reboot
  hosts: vpn_nodes
  gather_facts: false
  become: false
  # По одной ноде за раз: первая становится канарейкой, и если что-то пойдёт
  # не так — остальные шесть останутся нетронутыми. Плейбук трогает файрвол,
  # тут скорость не нужна.
  serial: 1
  any_errors_fatal: true
  vars:
    # Диапазон хоппинга. Совпадает с HYSTERIA2_PORT_HOPPING_RANGE бэкенда и с
    # тем, что уезжает клиенту в mport; менять только вместе с ними.
    hy2_hop_range: "20000-40000"
  tasks:
    - name: Detect Hysteria2 on the node
      ansible.builtin.stat:
        path: /etc/hysteria/config.yaml
      register: hy2_conf

    # Дальше — только там, где hysteria реально стоит. На остальных нодах
    # DNAT на диапазон был бы правилом в никуда.
    - name: Skip nodes without Hysteria2
      ansible.builtin.meta: end_host
      when: not hy2_conf.stat.exists

    - name: Read the port Hysteria2 actually listens on
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^listen:' /etc/hysteria/config.yaml | head -1 \
          | sed 's/.*://; s/[^0-9]//g'
      args:
        executable: /bin/bash
      register: hy2_listen
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Fall back to 443 when the port could not be read
      ansible.builtin.set_fact:
        hy2_port: "{{ (hy2_listen.stdout | trim) if (hy2_listen.stdout | trim) is match('^[0-9]+$') else '443' }}"

    # ── Защита от затирания живых правил ───────────────────────────────
    - name: Back up the saved ruleset
      ansible.builtin.copy:
        src: /etc/iptables/rules.v4
        dest: /etc/iptables/rules.v4.pre-hy2fix
        remote_src: true
        mode: "0640"
        force: false
      failed_when: false

    - name: Find rules that live only in the kernel (would be lost on restore)
      ansible.builtin.shell: |
        set -o pipefail
        iptables-save | grep -vE '^#|^:|^\*|^COMMIT' | sort > /tmp/hy2fix.kern
        grep -vE '^#|^:|^\*|^COMMIT' /etc/iptables/rules.v4 2>/dev/null | sort > /tmp/hy2fix.file
        comm -23 /tmp/hy2fix.kern /tmp/hy2fix.file
      args:
        executable: /bin/bash
      register: kernel_only
      check_mode: false
      changed_when: false

    - name: Refuse when the kernel holds rules the file does not
      ansible.builtin.fail:
        msg: |
          На {{ inventory_hostname }} в ядре есть правила, которых нет в
          /etc/iptables/rules.v4. Установка iptables-persistent сделает
          restore из файла и СОТРЁТ их. Разобраться руками (runbook §14):
          {{ kernel_only.stdout }}
      when: (kernel_only.stdout | trim) | length > 0

    # ufw и iptables-persistent конфликтуют, и apt снесёт ufw ради второго.
    # На наших нодах ufw всегда inactive (правила пишет bootstrap напрямую
    # через iptables), так что потери нет — но если где-то он окажется
    # активным, там стоят чьи-то живые правила, и молча сносить их нельзя.
    # stderr не глушим: «нужен root» уходит именно туда, и без него гейт
    # молча пропустил бы ноду.
    - name: Check whether ufw is actually active
      ansible.builtin.shell: ufw status 2>&1 || true
      args:
        executable: /bin/bash
      register: ufw_state
      check_mode: false
      changed_when: false

    - name: Refuse to touch a node with an active ufw
      ansible.builtin.fail:
        msg: >-
          На {{ inventory_hostname }} ufw активен либо его статус не удалось
          прочитать ({{ ufw_state.stdout | trim }}). Установка
          iptables-persistent снесёт ufw вместе с правилами — разбираться
          руками, см. runbook §14.
      when: >-
        'Status: active' in (ufw_state.stdout | default('')) or
        'Status: inactive' not in (ufw_state.stdout | default(''))

    # Пакет в postinst спрашивает через debconf, сохранять ли текущие правила.
    # Без preseed неинтерактивный прогон виснет на диалоге (тот же приём, что
    # в bootstrap_node). На restore этот ключ не влияет — только на save.
    - name: Preseed iptables-persistent (no interactive prompts)
      ansible.builtin.debconf:
        name: iptables-persistent
        question: "{{ item }}"
        vtype: boolean
        value: "false"
      loop:
        - iptables-persistent/autosave_v4
        - iptables-persistent/autosave_v6
      failed_when: false

    - name: Ensure iptables-persistent is installed
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600
      register: pkg_install

    - name: Ensure the unit is enabled so rules come back after reboot
      ansible.builtin.systemd:
        name: netfilter-persistent
        enabled: true
      failed_when: false

    - name: Ensure Hysteria2 port-hopping DNAT rule
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        protocol: udp
        destination_port: "{{ hy2_hop_range | replace('-', ':') }}"
        jump: DNAT
        to_destination: ":{{ hy2_port }}"
        comment: hy2-port-hopping
        action: append
        state: present
      register: dnat_rule

    - name: Persist rules across reboots
      ansible.builtin.command: netfilter-persistent save
      changed_when: false

    # Проверяем не факт выполнения тасков, а результат в ядре: именно
    # расхождение «в файле есть, в ядре нет» и было исходной болезнью.
    # Матчим правило целиком (диапазон + назначение), а не просто comment —
    # иначе старое правило с чужим портом дало бы зелёный отчёт.
    - name: Verify the DNAT rule is live and points at the right port
      ansible.builtin.shell: |
        set -o pipefail
        iptables -t nat -S PREROUTING \
          | grep -F -- '--dport {{ hy2_hop_range | replace("-", ":") }}' \
          | grep -c -F -- '--to-destination :{{ hy2_port }}'
      args:
        executable: /bin/bash
      register: dnat_live
      check_mode: false
      changed_when: false
      # В --check правило не добавляется, и проверять его наличие бессмысленно.
      failed_when: not ansible_check_mode and (dnat_live.stdout | trim | int) < 1

    # Отдельно — INPUT для самого hy2. Правило ставит install_hysteria2, и
    # если restore его не вернул, хоппинг будет работать, а обычный hy2 нет.
    - name: Verify Hysteria2 UDP port is still accepted in INPUT
      ansible.builtin.shell: |
        set -o pipefail
        iptables -S INPUT | grep -c -E -- '-p udp .*--dport {{ hy2_port }} -j ACCEPT' || true
      args:
        executable: /bin/bash
      register: hy2_input
      check_mode: false
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: hy2 на порту {{ hy2_port }},
          DNAT {{ hy2_hop_range }} → :{{ hy2_port }} активен,
          пакет {{ 'доустановлен' if pkg_install.changed else 'уже был' }},
          правило {{ 'добавлено' if dnat_rule.changed else 'уже стояло' }},
          INPUT-ACCEPT для hy2:
          {{ 'есть' if (hy2_input.stdout | trim | int) > 0 else 'НЕТ (политика ACCEPT спасает, но роль стоит прогнать)' }}.
