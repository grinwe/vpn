---
# resync_node_hy2.yml — батч-восстановление пер-юзерных hysteria2-учёток.
#
# Зеркало resync_node.yml для hy2: бэкенд (resync_node_hysteria2_clients)
# передаёт ВЕСЬ список клиентов ноды одной node/resync_hy2-таской вместо
# веера device/apply-тасок по одной на учётку (каждая = отдельный прогон
# provision_device.yml). Нужен после КАЖДОГО bootstrap'а ноды с hy2:
# config.yaml.j2 рендерит `userpass: {}` и стирает учётки (audit #78).
#
# Payload (extra-vars):
#   clients: [{username, password}, ...]
#
# Свежий manage_hy2_user.sh пушится перед лупом: на нодах, бутстрапленных до
# 2026-07, скрипт не знает NO_RESTART и рестартил бы hysteria-server на
# каждого юзера — systemd StartLimitBurst (5 за 10s) прибил бы сервис на
# батче. Рестарт — ОДИН, в конце.
- hosts: vpn_nodes
  become: yes
  # gather_facts: false — как в resync_node.yml: ни одного факта не
  # используем, а full setup стоит +5-10s на каждый прогон.
  gather_facts: false
  vars:
    clients: []
  tasks:
    - name: Stat hy2 manage script
      stat:
        path: /usr/local/sbin/manage_hy2_user.sh
      register: hy2_manage_script

    # Скрипта нет = hy2-роль на ноду не ставилась; молча скипаем (паритет
    # с ветками resync_node.yml), таска остаётся success.
    - name: Push fresh manage_hy2_user.sh (NO_RESTART support)
      copy:
        src: "{{ playbook_dir }}/../roles/install_hysteria2/files/manage_hy2_user.sh"
        dest: /usr/local/sbin/manage_hy2_user.sh
        mode: "0755"
      when:
        - hy2_manage_script.stat.exists
        - clients | length > 0

    # Батч вместо цикла: каждый клиент раньше стоил отдельного SSH-раунда и
    # отдельной перезаписи config.yaml, из-за чего время росло линейно и при
    # ~740 учётках упёрлось бы в ANSIBLE_PLAYBOOK_TIMEOUT=300 (аудит
    # 2026-07-25). Теперь один вызов на всю ноду.
    - name: Push bulk client applier
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/bulk_apply_clients.py"
        dest: /usr/local/sbin/bulk_apply_clients.py
        mode: "0750"
      when:
        - hy2_manage_script.stat.exists
        - clients | length > 0

    - name: Write hy2 client list (пароли — 0600, файл удаляется ниже)
      ansible.builtin.copy:
        content: "{{ clients | to_json }}"
        dest: /run/resync-hy2.json
        mode: "0600"
      no_log: true
      when:
        - hy2_manage_script.stat.exists
        - clients | length > 0

    - name: Resync hysteria2 clients (batch)
      ansible.builtin.command: >-
        /usr/local/sbin/bulk_apply_clients.py --kind hy2
        --clients /run/resync-hy2.json
      register: _hy2_add
      changed_when: "'применено клиентов' in _hy2_add.stdout"
      failed_when: false
      when:
        - hy2_manage_script.stat.exists
        - clients | length > 0

    - name: Drop hy2 client list
      ansible.builtin.file:
        path: /run/resync-hy2.json
        state: absent

    - name: Restart hysteria-server after resync
      systemd:
        name: hysteria-server
        state: restarted
      when:
        - hy2_manage_script.stat.exists
        - clients | length > 0

    # Диагностика ПОСЛЕ рестарта: сервис уже подхватил всё, что применилось.
    # Батч атомарен (конфиг пишется целиком либо не пишется), поэтому провал —
    # это «ни одна учётка не доехала», а не частичный успех.
    - name: Fail if the hy2 batch could not be applied
      ansible.builtin.fail:
        msg: >-
          bulk_apply_clients.py --kind hy2 провалился (rc={{ _hy2_add.rc }}):
          {{ (_hy2_add.stderr | default('')) [:300] }}
          — все {{ clients | length }} учёток остались без применения.
      when:
        - hy2_manage_script.stat.exists
        - clients | length > 0
        - _hy2_add.rc | default(0) != 0
