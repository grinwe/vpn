---
# resync_node.yml
#
# Re-apply a full set of vless-family clients to an existing node.
#
# Context: the install_vless_* roles now preserve clients across
# re-renders (slurp + re-inject), but that only works if the previous
# /usr/local/etc/xray/config*.json exists and is parseable. On a fresh
# bootstrap, or after an operator manually wiped the file, the rendered
# config is empty and every previously-provisioned user gets kicked
# with "invalid request user id" until someone re-adds them. Same
# thing happens when a template re-render races the per-user
# manage_vless_*_user.sh script and overwrites a client that was
# added in the same tick.
#
# This playbook is the "re-add" step. Backend calls it from
# ProvisioningOrchestrator.resync_node_clients() with payload:
#
#   clients_by_proto:
#     vless-reality: [ {username, uuid}, ... ]
#     vless-xhttp:   [ {username, uuid}, ... ]
#     vless-ws-cdn:  [ {username, uuid}, ... ]
#
#   clients: [ ... ]   # backwards-compat flat list (reality only) for
#                     # any in-flight tasks enqueued before the rewrite
#
# Each protocol has its own config file + manage_vless_*_user.sh helper
# and must be resynced independently. The helpers are idempotent (drop
# any existing entry with the same email before re-appending) so
# running this twice is safe.
- hosts: vpn_nodes
  become: yes
  # gather_facts: false — resync_node не использует ни одного факта
  # (ansible_*), только slurp/command/systemd. С gather_facts=true
  # (default) каждый прогон ходит за full setup на ноду — это +5-10s
  # к и без того короткому play. Worker дёргает resync сотни раз за
  # день, экономия суммарно ощутима. См. discussion 2026-05-26.
  gather_facts: false
  vars:
    clients_by_proto: {}
    clients: []
    # Legacy flat `clients` list is treated as vless-reality for
    # backwards-compat with tasks enqueued by the old backend code.
    _reality_clients: >-
      {{ clients_by_proto.get('vless-reality', clients) }}
    _xhttp_clients: >-
      {{ clients_by_proto.get('vless-xhttp', []) }}
    _ws_cdn_clients: >-
      {{ clients_by_proto.get('vless-ws-cdn', []) }}
  tasks:
    # ---- Read enforcer blocklist (sharing-blocked users) ---------
    - name: Read enforcer blocklist
      slurp:
        src: /var/log/xray/enforcer_blocklist.txt
      register: _enforcer_blocklist_raw
      failed_when: false
      changed_when: false

    - name: Parse enforcer blocklist
      set_fact:
        _enforcer_blocklist: >-
          {{ (_enforcer_blocklist_raw.content | default('') | b64decode).split('\n')
             | map('trim') | select | list }}
      when: _enforcer_blocklist_raw.content is defined

    - name: Default empty blocklist
      set_fact:
        _enforcer_blocklist: []
      when: _enforcer_blocklist_raw.content is not defined

    # Батч-применятель: раньше каждая ветка ниже гоняла ansible-loop, где
    # КАЖДЫЙ клиент = отдельный SSH-раунд и отдельная перезапись конфига.
    # Время росло линейно (≈15с + 0.38с × клиентов, замер по 25 прогонам) и
    # при ~740 кредах на ноду упиралось в ANSIBLE_PLAYBOOK_TIMEOUT=300 —
    # таска падала, нода оставалась несинхронизированной. Теперь один вызов
    # на протокол, время почти не зависит от числа клиентов (аудит 2026-07-25).
    - name: Push bulk client applier
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/bulk_apply_clients.py"
        dest: /usr/local/sbin/bulk_apply_clients.py
        mode: "0750"

    # ---- VLESS+Reality branch ------------------------------------
    - name: Stat VLESS Reality manage script
      stat:
        path: /usr/local/sbin/manage_vless_user.sh
      register: vless_reality_manage_script

    # NO_RESTART=1 tells manage scripts to skip systemctl restart
    # after each user — we restart once after the whole batch.
    # Without this, systemd's StartLimitBurst (default 5 in 10s)
    # kills the service after the 5th rapid restart.
    - name: Write reality client list (secrets — 0600, removed below)
      ansible.builtin.copy:
        content: "{{ _reality_clients | rejectattr('username', 'in', _enforcer_blocklist) | list | to_json }}"
        dest: /run/resync-reality.json
        mode: "0600"
      no_log: true
      when:
        - vless_reality_manage_script.stat.exists
        - _reality_clients | length > 0

    - name: Resync VLESS+Reality clients (batch)
      ansible.builtin.command: >-
        /usr/local/sbin/bulk_apply_clients.py --kind reality
        --clients /run/resync-reality.json
      register: _bulk_reality
      changed_when: "'применено клиентов' in _bulk_reality.stdout"
      when:
        - vless_reality_manage_script.stat.exists
        - _reality_clients | length > 0

    - name: Drop reality client list
      ansible.builtin.file:
        path: /run/resync-reality.json
        state: absent

    - name: Restart xray after reality resync
      systemd:
        name: xray
        state: restarted
      when:
        - vless_reality_manage_script.stat.exists
        - _reality_clients | length > 0

    # ---- VLESS+XHTTP branch --------------------------------------
    - name: Stat VLESS XHTTP manage script
      stat:
        path: /usr/local/sbin/manage_vless_xhttp_user.sh
      register: vless_xhttp_manage_script

    - name: Write xhttp client list (secrets — 0600, removed below)
      ansible.builtin.copy:
        content: "{{ _xhttp_clients | rejectattr('username', 'in', _enforcer_blocklist) | list | to_json }}"
        dest: /run/resync-xhttp.json
        mode: "0600"
      no_log: true
      when:
        - vless_xhttp_manage_script.stat.exists
        - _xhttp_clients | length > 0

    - name: Resync VLESS+XHTTP clients (batch)
      ansible.builtin.command: >-
        /usr/local/sbin/bulk_apply_clients.py --kind xhttp
        --clients /run/resync-xhttp.json
      register: _bulk_xhttp
      changed_when: "'применено клиентов' in _bulk_xhttp.stdout"
      when:
        - vless_xhttp_manage_script.stat.exists
        - _xhttp_clients | length > 0

    - name: Drop xhttp client list
      ansible.builtin.file:
        path: /run/resync-xhttp.json
        state: absent

    - name: Restart xray-xhttp after resync
      systemd:
        name: xray-xhttp
        state: restarted
      when:
        - vless_xhttp_manage_script.stat.exists
        - _xhttp_clients | length > 0

    # ---- VLESS+WS+CDN branch -------------------------------------
    - name: Stat VLESS WS+CDN manage script
      stat:
        path: /usr/local/sbin/manage_vless_ws_user.sh
      register: vless_ws_manage_script

    - name: Write ws client list (secrets — 0600, removed below)
      ansible.builtin.copy:
        content: "{{ _ws_cdn_clients | rejectattr('username', 'in', _enforcer_blocklist) | list | to_json }}"
        dest: /run/resync-ws.json
        mode: "0600"
      no_log: true
      when:
        - vless_ws_manage_script.stat.exists
        - _ws_cdn_clients | length > 0

    - name: Resync VLESS+WS+CDN clients (batch)
      ansible.builtin.command: >-
        /usr/local/sbin/bulk_apply_clients.py --kind ws
        --clients /run/resync-ws.json
      register: _bulk_ws
      changed_when: "'применено клиентов' in _bulk_ws.stdout"
      when:
        - vless_ws_manage_script.stat.exists
        - _ws_cdn_clients | length > 0

    - name: Drop ws client list
      ansible.builtin.file:
        path: /run/resync-ws.json
        state: absent

    - name: Restart xray-ws-cdn after resync
      systemd:
        name: xray-ws-cdn
        state: restarted
      when:
        - vless_ws_manage_script.stat.exists
        - _ws_cdn_clients | length > 0

    # ---- Log -----------------------------------------------------
    - name: Log resync payload
      debug:
        msg: >-
          Resynced on {{ inventory_hostname }}:
          reality={{ _reality_clients | length }}
          xhttp={{ _xhttp_clients | length }}
          ws_cdn={{ _ws_cdn_clients | length }}
