---
# Точечный апгрейд бинаря hysteria БЕЗ полного site.yml. Зеркало
# playbooks/upgrade_xray.yml: зовётся из provisioning._execute_task
# (action=upgrade_hysteria) — кнопка «Обновить hysteria» в админке и батч по
# выбранным нодам.
#
# Подключаем ТОЛЬКО бинарную часть роли (tasks_from: binary): остальная роль
# рендерит config.yaml, правит iptables и требует hysteria2_port/domain/сертов,
# которых у точечного апгрейда нет и которые ему не нужны. Пер-юзерные учётки
# (auth.userpass) лежат в config.yaml — раз мы его не трогаем, доступ клиентов
# апгрейд не задевает.
#
# ⚠️ Версия и sha256 идут ПАРОЙ (roles/install_hysteria2/defaults/main.yml):
# подмена версии без пересчёта хэша заставит fetch-скрипт отвергнуть каждый
# источник и оставит ноду на старом бинаре (громко, rc=1).
#
# ⚠️ Рестарт hysteria-server рвёт активные QUIC-сессии; клиент переустанавливает
# соединение сам (у hy2 это быстрее TCP-хендшейка, но не бесшовно).
- name: Upgrade hysteria binary on node
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install / refresh hysteria binary
      ansible.builtin.include_role:
        name: install_hysteria2
        tasks_from: binary

    - name: Report installed hysteria version
      ansible.builtin.command: /usr/local/bin/hysteria version
      register: _hysteria_version_after
      changed_when: false
      failed_when: false

    - name: Show installed hysteria version
      ansible.builtin.debug:
        msg: >-
          hysteria on {{ inventory_hostname }}:
          {{ (_hysteria_version_after.stdout_lines | select('match', '^Version') | first)
             | default('unknown') }}
