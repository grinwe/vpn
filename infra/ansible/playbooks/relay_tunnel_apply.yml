---
# Stage E of the relay architecture (docs/RELAY_ROADMAP.md).
#
# Reconciles the WireGuard client side of a relay VPN node. The
# relay_jump_node role has two modes: with relay_wg_* vars set it
# enables the tunnel + patches Xray; without them it tears the
# tunnel down and unpatches Xray (idempotent cleanup). This
# lightweight playbook only runs that one role — avoiding the full
# site.yml cost when we only want to touch tunnel state.
#
# Required extra vars (built by services/provisioning
# ._collect_relay_tunnel_extra_vars, all optional — empty/missing vars
# put the role into disable mode):
#   relay_wg_private_key
#   relay_wg_address_v4
#   relay_wg_endpoint
#   relay_wg_exit_public_key

- hosts: vpn_nodes
  become: yes
  roles:
    - relay_jump_node
