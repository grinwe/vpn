    # Monitoring host — runs Prometheus + Grafana via docker-compose.
    # Access is over an SSH tunnel (ports bound to 127.0.0.1 on the box),
    # so this host does not need to be publicly exposed on :3000 / :9090.
    #
    # Same physical server is currently used by vpn-setup/inventory.yml
    # for the NL CDN/WG stack — docker-compose for grafana lives in
    # /opt/vpn-monitoring and doesn't conflict with nginx/xray already
    # there (different ports, different filesystem paths).
    monitoring:
      hosts:
        nl-monitoring:
          ansible_host: 185.242.87.250
          ansible_user: root
    # Public web host — nginx + certbot terminating TLS for
    # grinwer.online and proxying to the admin SPA and backend
    # containers running on the same box. For now it's the same NL
    # server that runs monitoring; splitting is a trivial inventory
    # change later.
    web:
      hosts:
        nl-web:
          ansible_host: 185.242.87.250
          ansible_user: root
