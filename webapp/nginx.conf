server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA at /app/. Unknown paths fall through to index.html so any
    # client-side routing keeps working.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = / {
        return 302 /app/;
    }
}
