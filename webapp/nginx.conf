server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хэшированные бандлы Vite: контент под таким именем не меняется никогда.
    # Нет файла на диске → честный 404, НЕ index.html: 200+HTML под .js-URL
    # блокируется webview по MIME (белый лист) и отравляет кэш Cloudflare
    # на 4 часа. add_header без always — 404 не должен получить immutable.
    location /app/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA at /app/. Unknown paths fall through to index.html so any
    # client-side routing keeps working. no-cache = «храни, но ревалидируй»:
    # гасит эвристическое кэширование RFC 9111 в Telegram-webview (после
    # деплоя клиенты держали старый index.html часами), при этом условный
    # запрос с ETag/Last-Modified стоит один 304 в ~0 байт.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        return 302 /app/;
    }
}
