version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vpn
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: supersecret
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://vpn:supersecret@db:5432/vpn
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: "ТОКЕН_Бота"
      BACKEND_URL: "http://backend:8000"
    restart: unless-stopped

volumes:
  db_data:
