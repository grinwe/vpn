version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vpn
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: "http://backend:8000"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
