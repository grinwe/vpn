version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vpn
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn -d vpn"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      REDIS_URL: "redis://redis:6379/0"
      QUEUE_BACKEND: "rq"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-cryptobot}
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      TELEGRAM_STARS_WEBHOOK_SECRET: ${TELEGRAM_STARS_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      REDIS_URL: "redis://redis:6379/0"
      QUEUE_BACKEND: "rq"
      ANSIBLE_ROOT: /app/infra/ansible
      ANSIBLE_PRIVATE_KEY_FILE: /run/secrets/provisioning_key
      AUTOSCALE_INTERVAL: ${AUTOSCALE_INTERVAL:-300}
      RENEWAL_CHECK_INTERVAL: ${RENEWAL_CHECK_INTERVAL:-300}
      RENEWAL_GRACE_HOURS: ${RENEWAL_GRACE_HOURS:-24}
    volumes:
      - ${PROVISIONING_SSH_KEY:-/dev/null}:/run/secrets/provisioning_key:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build: ./admin
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: "http://backend:8000"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-cryptobot}
      TELEGRAM_STARS_WEBHOOK_SECRET: ${TELEGRAM_STARS_WEBHOOK_SECRET:-}
      SUB_LINK_BASE_URL: ${SUB_LINK_BASE_URL:-}
      NOTIFICATION_POLL_INTERVAL: ${NOTIFICATION_POLL_INTERVAL:-10}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
