server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA at /admin/. Any unknown path under /admin/ must fall through
    # to index.html so react-router can handle it.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = / {
        return 302 /admin/;
    }
}
