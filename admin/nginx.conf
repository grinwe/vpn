server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA at /${ADMIN_BASE_PATH}/. Путь подставляется envsubst'ом при
    # старте контейнера (см. Dockerfile). Любой unknown path под этой
    # базой падает в index.html — react-router разбирается дальше.
    location /${ADMIN_BASE_PATH}/ {
        try_files $uri $uri/ /${ADMIN_BASE_PATH}/index.html;
    }
}
