server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хэшированные бандлы Vite: имя меняется вместе с контентом, поэтому
    # кэшируем на год. Нет файла → честный 404, НЕ index.html-fallback:
    # 200+HTML под .js-URL блокируется по MIME (белый лист после деплоя)
    # и отравляет кэш Cloudflare. add_header без always — чтобы 404 не
    # закэшировался как immutable.
    location /${ADMIN_BASE_PATH}/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA at /${ADMIN_BASE_PATH}/. Путь подставляется envsubst'ом при
    # старте контейнера (см. Dockerfile). Любой unknown path под этой
    # базой падает в index.html — react-router разбирается дальше.
    # no-cache гасит эвристическое кэширование index.html в браузере
    # (ревалидация по ETag = дешёвый 304, свежесть гарантирована).
    location /${ADMIN_BASE_PATH}/ {
        try_files $uri $uri/ /${ADMIN_BASE_PATH}/index.html;
        add_header Cache-Control "no-cache" always;
    }
}
