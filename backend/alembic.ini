[alembic]
# Path to the migration scripts, relative to this file.
script_location = app/alembic

# DB URL is injected from the DATABASE_URL env var at runtime via env.py.
# Keep this blank so running ``alembic`` without env vars fails loudly.
sqlalchemy.url =

# Use plain timestamp-prefixed filenames for new revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
