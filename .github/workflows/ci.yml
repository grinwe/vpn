name: CI

on:
  pull_request:
  push:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff ansible ansible-lint
      - name: Static analysis
        run: |
          ruff check backend bot
      - name: Ansible lint
        run: |
          ansible-lint infra/ansible
      - name: Import smoke tests
        run: |
          python -m compileall backend bot
      - name: Build backend image
        run: docker build backend --tag backend:ci
      - name: Build bot image
        run: docker build bot --tag bot:ci
