name: CI

on:
  pull_request:
  push:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # Postgres runs as a service container so the integration suite can
    # hit a real DB. The credentials + port match the defaults baked
    # into backend/tests/conftest.py.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vpn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/vpn_test
      ADMIN_API_TOKEN: test-admin-token
      APP_SECRET_KEY: test-secret-key-not-used-in-prod
      ALLOW_INPROCESS_PROVISIONING: "1"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff ansible ansible-lint
      - name: Static analysis
        run: |
          ruff check backend bot probes
      - name: Ansible lint
        run: |
          ansible-lint infra/ansible
      - name: Import smoke tests
        run: |
          python -m compileall backend bot probes
      - name: Integration tests (pytest + real postgres)
        run: |
          cd backend && python -m pytest -v tests/
      - name: Build backend image
        run: docker build backend --tag backend:ci
      - name: Build worker image
        run: docker build -f backend/Dockerfile.worker . --tag worker:ci
      - name: Build bot image
        run: docker build bot --tag bot:ci
      - name: Build probe image
        run: docker build probes --tag probe:ci
